<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Логгер для роботов — перетаскивание кнопок + разделитель</title>
    <style>
        /* Стили полностью сохранены из предыдущей версии */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.2s;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            padding: 1vh 1vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: #1a1a1a;
        }
        
        :root {
            --header-height: 8vh;
            --selector-height: 7vh;
            --input-height: 7vh;
            --keyboard-max-height: 30vh;
            --stats-height: 4vh;
            --global-actions-height: 7vh;
            --spacing: 1vh;
            --border-radius: 2vw;
            --font-size-large: min(3.5vh, 5vw);
            --font-size-medium: min(2.5vh, 4vw);
            --font-size-small: min(2vh, 3.5vw);
            --splitter-height: 8px;
            --splitter-mobile-height: 12px;
        }
        
        body.dark-theme {
            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        body.dark-theme .container {
            background: #2d2d2d;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        body.dark-theme .header {
            background: #3d3d3d;
            border-bottom-color: #4a4a4a;
        }
        
        body.dark-theme .message {
            background: #3d3d3d;
        }
        
        body.dark-theme .button-row button {
            background: #4a4a4a;
            color: #fff;
        }
        
        body.dark-theme .button-row button:hover {
            background: #5a5a5a;
        }
        
        body.dark-theme .button-row button.primary {
            background: #4CAF50;
        }
        
        body.dark-theme .button-row button.danger {
            background: #f44336;
        }
        
        body.dark-theme .input-group input {
            background: #2d2d2d;
            color: #fff;
            border-color: #4a4a4a;
        }
        
        body.dark-theme .splitter {
            background: #4a4a4a;
        }
        body.dark-theme .splitter:hover,
        body.dark-theme .splitter.active {
            background: #6a6a6a;
        }
        body.dark-theme .splitter::before {
            background: rgba(255, 255, 255, 0.1);
        }
        
        body.light-theme {
            background: #f0f2f5;
            color: #1a1a1a;
        }
        
        body.light-theme .container {
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        body.light-theme .header {
            background: #f8f9fa;
            border-bottom-color: #dee2e6;
        }
        
        body.light-theme .message {
            background: #f8f9fa;
        }
        
        body.light-theme .button-row button {
            background: #e9ecef;
            color: #1a1a1a;
        }
        
        body.light-theme .button-row button:hover {
            background: #dee2e6;
        }
        
        body.light-theme .button-row button.primary {
            background: #0d6efd;
            color: white;
        }
        
        body.light-theme .button-row button.danger {
            background: #dc3545;
            color: white;
        }
        
        body.light-theme .input-group input {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #dee2e6;
        }
        
        body.light-theme .splitter {
            background: #dee2e6;
        }
        body.light-theme .splitter:hover,
        body.light-theme .splitter.active {
            background: #adb5bd;
        }
        body.light-theme .splitter::before {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .container {
            width: 100%;
            height: 98vh;
            max-width: 1400px;
            border-radius: var(--border-radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #2d2d2d;
            position: relative;
        }
        
        .header {
            padding: var(--spacing) min(3vw, 20px);
            height: var(--header-height);
            min-height: var(--header-height);
            border-bottom: 1px solid;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .header h1 {
            font-size: var(--font-size-large);
            line-height: 1.2;
        }
        
        .header .user-info {
            font-size: var(--font-size-small);
            opacity: 0.8;
            margin-top: 0.2vh;
        }
        
        .user-selector {
            padding: var(--spacing) min(3vw, 20px);
            height: var(--selector-height);
            min-height: var(--selector-height);
            display: flex;
            gap: 1vw;
            align-items: center;
            border-bottom: 1px solid;
            flex-shrink: 0;
        }
        
        .user-selector select {
            flex: 2;
            height: 70%;
            padding: 0 2vw;
            border: 1px solid;
            border-radius: 1vw;
            background: inherit;
            color: inherit;
            font-size: var(--font-size-medium);
        }
        
        .user-selector button {
            flex: 1;
            height: 70%;
            padding: 0 1vw;
            border: none;
            border-radius: 1vw;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            white-space: nowrap;
            font-size: var(--font-size-small);
        }
        
        .resizable-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }
        
        .logs-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100px;
            overflow: hidden;
        }
        
        .splitter {
            height: var(--splitter-height);
            min-height: var(--splitter-height);
            cursor: row-resize;
            flex-shrink: 0;
            position: relative;
            transition: background 0.2s;
            user-select: none;
        }
        .splitter::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            transition: opacity 0.2s;
        }
        .splitter:hover::before,
        .splitter.active::before {
            opacity: 0;
        }
        
        .bottom-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing) min(3vw, 20px);
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            border-radius: 1.5vw;
            padding: min(1.5vh, 15px) min(2vw, 15px);
            margin-bottom: var(--spacing);
            border-left: 0.5vw solid #4CAF50;
            font-size: var(--font-size-medium);
        }
        
        .message.system {
            border-left-color: #FFC107;
        }
        
        .message .time {
            font-size: var(--font-size-small);
            opacity: 0.6;
            margin-bottom: 0.5vh;
        }
        
        .message .text {
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .keyboard {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing) min(3vw, 20px);
            -webkit-overflow-scrolling: touch;
            min-height: 0;
        }
        
        .button-grid {
            display: grid;
            gap: var(--spacing);
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        }
        
        .button-grid button {
            padding: min(1.5vh, 12px) min(2vw, 12px);
            border: none;
            border-radius: 1.5vw;
            cursor: pointer;
            font-size: var(--font-size-medium);
            word-break: break-word;
            white-space: normal;
            line-height: 1.3;
            background: #4a4a4a;
            color: #fff;
            transition: background 0.2s;
        }
        
        body.light-theme .button-grid button {
            background: #e9ecef;
            color: #1a1a1a;
        }
        
        .button-grid button.primary {
            background: #4CAF50;
            color: white;
        }
        
        .button-grid button.danger {
            background: #f44336;
            color: white;
        }
        
        .button-row {
            display: flex;
            gap: 1vw;
            flex-wrap: wrap;
            margin-bottom: var(--spacing);
        }
        
        .button-row button {
            flex: 1 1 calc(50% - 1vw);
            min-width: 40%;
            padding: min(1.5vh, 12px) min(2vw, 12px);
            border: none;
            border-radius: 1.5vw;
            cursor: pointer;
            font-size: var(--font-size-medium);
            word-break: break-word;
            white-space: normal;
            line-height: 1.2;
        }
        
        .input-area {
            flex-shrink: 0;
            padding: var(--spacing) min(3vw, 20px);
            background: inherit;
        }
        
        .input-group {
            display: flex;
            gap: 1vw;
            height: 100%;
        }
        
        .input-group input {
            flex: 1;
            height: var(--input-height);
            padding: 0 min(2vw, 12px);
            border: 1px solid;
            border-radius: 1.5vw;
            font-size: var(--font-size-medium);
            background: inherit;
            color: inherit;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        .input-group button {
            height: var(--input-height);
            padding: 0 min(3vw, 24px);
            border: none;
            border-radius: 1.5vw;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: var(--font-size-medium);
            white-space: nowrap;
        }
        
        .stats {
            flex-shrink: 0;
            height: var(--stats-height);
            min-height: var(--stats-height);
            padding: 0 min(3vw, 20px);
            font-size: var(--font-size-small);
            opacity: 0.6;
            text-align: center;
            border-top: 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .global-actions {
            flex-shrink: 0;
            height: var(--global-actions-height);
            min-height: var(--global-actions-height);
            padding: var(--spacing) min(3vw, 20px);
            display: flex;
            gap: 1vw;
            border-top: 1px solid;
        }
        
        .global-actions button {
            flex: 1;
            height: 100%;
            padding: 0 min(1vw, 12px);
            border: none;
            border-radius: 1.5vw;
            cursor: pointer;
            font-size: var(--font-size-medium);
            font-weight: 500;
            white-space: nowrap;
        }
        
        .global-actions button.primary {
            background: #4CAF50;
            color: white;
        }
        
        .global-actions button.danger {
            background: #f44336;
            color: white;
        }
        
        .hidden {
            display: none !important;
        }
        
        .coords-link {
            color: #4CAF50;
            font-weight: bold;
            text-decoration: underline dotted;
            cursor: pointer;
        }
        
        .coords-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        
        .address-text {
            color: inherit;
            font-weight: bold;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 1vw;
            padding: min(1vh, 8px);
            background: inherit;
            border: 1px solid;
            border-radius: 1vw;
            margin-bottom: 0.5vh;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: min(4vh, 20px);
            height: min(4vh, 20px);
            cursor: pointer;
        }
        
        .checkbox-item label {
            flex: 1;
            cursor: pointer;
            font-size: var(--font-size-small);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.5);
        }
        
        body.light-theme ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        
        body.light-theme ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
        }
        
        @media (max-width: 600px) {
            :root {
                --header-height: 7vh;
                --selector-height: 8vh;
                --input-height: 6vh;
                --keyboard-max-height: 35vh;
                --stats-height: 4vh;
                --global-actions-height: 7vh;
                --spacing: 0.8vh;
                --border-radius: 3vw;
                --font-size-large: min(4vh, 6vw);
                --font-size-medium: min(3vh, 4.5vw);
                --font-size-small: min(2.5vh, 3.5vw);
                --splitter-height: var(--splitter-mobile-height);
            }
            
            body {
                padding: 0;
            }
            
            .container {
                height: 100vh;
                width: 100vw;
                max-width: none;
                border-radius: 0;
            }
            
            .button-grid {
                grid-template-columns: 1fr;
            }
            
            .button-grid button {
                padding: 1.2vh 2vw;
                font-size: var(--font-size-medium);
            }
            
            .button-row button {
                flex: 1 1 100%;
                min-width: 100%;
                padding: 1.5vh min(3vw, 15px);
            }
            
            .user-selector {
                flex-wrap: wrap;
                height: auto;
                min-height: auto;
                padding: 1vh min(3vw, 15px);
            }
            
            .user-selector select,
            .user-selector button {
                height: 5vh;
                font-size: var(--font-size-medium);
            }
            
            .global-actions {
                height: auto;
                min-height: auto;
                padding: 1vh min(3vw, 15px);
            }
            
            .global-actions button {
                height: 6vh;
                font-size: var(--font-size-medium);
                white-space: normal;
                padding: 0 2vw;
            }
            
            .keyboard {
                max-height: 40vh;
            }
        }
        
        @media (max-width: 600px) and (max-height: 500px) {
            :root {
                --header-height: 10vh;
                --keyboard-max-height: 30vh;
                --input-height: 8vh;
            }
            
            .header h1 {
                font-size: var(--font-size-medium);
            }
            
            .message {
                padding: 0.8vh 2vw;
                margin-bottom: 0.5vh;
            }
            
            .button-grid button {
                padding: 1vh 2vw;
            }
        }
        
        .resizing-active {
            cursor: row-resize !important;
            user-select: none !important;
        }
        .resizing-active * {
            pointer-events: none;
        }
        
        .drag-button {
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .drag-button:active {
            cursor: grabbing;
        }
        .drag-over {
            border: 2px dashed #4CAF50 !important;
            background: rgba(76,175,80,0.2) !important;
            transform: scale(1.01);
        }
        .dragging-clone {
            opacity: 0.5;
            z-index: 9999;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transform: rotate(2deg) scale(1.02);
            pointer-events: none;
        }
        
        .edit-mode-active {
            background-color: #ff9800 !important;
            color: white !important;
        }
        
        .button-yellow {
            background: #ffc107 !important;
            color: #000 !important;
        }
        .button-info {
            background: #2196F3 !important;
            color: white !important;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="container">
        <div class="header">
            <h1>🤖 Логгер для роботов</h1>
            <div class="user-info" id="userInfo"></div>
        </div>
        
        <div class="user-selector" id="userSelector">
            <select id="userSelect">
                <option value="">Выберите пользователя...</option>
            </select>
            <button onclick="addNewUser()">➕ Новый</button>
            <button onclick="switchUser()">🔑 Войти</button>
        </div>
        
        <div class="resizable-area" id="resizableArea">
            <div class="logs-container" id="logsContainer">
                <div class="content" id="chatContent">
                    <div class="message system">
                        <div class="time"></div>
                        <div class="text">Добро пожаловать! Выберите пользователя для начала работы.</div>
                    </div>
                </div>
            </div>
            
            <div class="splitter" id="splitter"></div>
            
            <div class="bottom-panel" id="bottomPanel">
                <div class="input-area hidden" id="inputArea">
                    <div class="input-group">
                        <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
                        <button onclick="sendMessage()">Отпр</button>
                    </div>
                </div>
                
                <div class="keyboard" id="keyboardArea"></div>
                
                <div class="stats" id="stats"></div>
            </div>
        </div>
        
        <div class="global-actions" id="globalActions">
            <button class="primary" onclick="handleFullBackupNoUser()">💾 Экспорт</button>
            <button class="danger" onclick="handleClearCacheNoUser()">🗑️ Очистка</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        // ============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        function formatTimeWithoutSeconds(date) {
            let hours = date.getHours().toString().padStart(2, '0');
            let minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function formatTimeWithSeconds(date) {
            let hours = date.getHours().toString().padStart(2, '0');
            let minutes = date.getMinutes().toString().padStart(2, '0');
            let seconds = date.getSeconds().toString().padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function formatTimeForLog(date, includeSeconds = false) {
            return includeSeconds ? formatTimeWithSeconds(date) : formatTimeWithoutSeconds(date);
        }

        function normalizeTimeString(timeStr) {
            if (!timeStr) return null;
            const match = String(timeStr).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
            if (!match) return null;
            return {
                hours: Number(match[1]),
                minutes: Number(match[2]),
                seconds: Number(match[3] || 0),
                hasSeconds: Boolean(match[3])
            };
        }

        function stripSecondsFromTimeString(timeStr) {
            const parsed = normalizeTimeString(timeStr);
            if (!parsed) return timeStr || '';
            return `${String(parsed.hours).padStart(2, '0')}:${String(parsed.minutes).padStart(2, '0')}`;
        }

        function computeDuration(startTimeStr, endTimeStr) {
            const start = normalizeTimeString(startTimeStr);
            const end = normalizeTimeString(endTimeStr);
            if (!start || !end) return "0мин";
            let startTotal = start.hours * 60 + start.minutes;
            let endTotal = end.hours * 60 + end.minutes;
            let diff = endTotal - startTotal;
            if (diff < 0) diff += 24 * 60;
            let hours = Math.floor(diff / 60);
            let minutes = diff % 60;
            if (hours === 0 && minutes === 0) return "0мин";
            if (hours === 0) return `${minutes}мин`;
            if (minutes === 0) return `${hours}ч`;
            return `${hours}ч${minutes}мин`;
        }

        function getLogEntryText(logEntry) {
            if (typeof logEntry === 'string') return logEntry;
            if (logEntry && typeof logEntry === 'object' && logEntry.text) return logEntry.text;
            return '';
        }

        function extractTimePrefix(logEntry) {
            const text = getLogEntryText(logEntry);
            const match = text.match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s+/);
            return match ? match[1] : null;
        }

        function isRouteStartLog(logEntry) {
            return getLogEntryText(logEntry).includes('Начало маршрута');
        }

        function recalculateCurrentStartTimeFromLogs(logs) {
            for (let i = logs.length - 1; i >= 0; i--) {
                const log = logs[i];
                if (isRouteStartLog(log)) {
                    const time = extractTimePrefix(log);
                    if (time) return time;
                }
            }
            return null;
        }

        function ensureUserSettings(user) {
            if (!user.settings) user.settings = {};
            if (typeof user.settings.theme !== 'string') user.settings.theme = 'dark';
            if (typeof user.settings.showSecondsInLogs !== 'boolean') user.settings.showSecondsInLogs = false;
            if (typeof user.settings.autoBackupInterval !== 'number') user.settings.autoBackupInterval = 0;
            if (!('autoBackupNextAt' in user.settings)) user.settings.autoBackupNextAt = null;
            return user.settings;
        }

        function ensureAutoBackupSchedule(user) {
            const settings = ensureUserSettings(user);
            const interval = settings.autoBackupInterval || 0;
            if (interval <= 0) {
                settings.autoBackupNextAt = null;
                return null;
            }
            if (!settings.autoBackupNextAt) {
                settings.autoBackupNextAt = new Date(Date.now() + interval * 60000).toISOString();
                db.save();
            }
            return settings.autoBackupNextAt;
        }

        function getAutoBackupRemainingMinutes(user) {
            const settings = ensureUserSettings(user);
            const interval = settings.autoBackupInterval || 0;
            if (interval <= 0) return null;
            const nextAt = settings.autoBackupNextAt ? new Date(settings.autoBackupNextAt).getTime() : null;
            if (!nextAt || Number.isNaN(nextAt)) return interval;
            const diffMs = nextAt - Date.now();
            return Math.max(0, Math.ceil(diffMs / 60000));
        }

        function formatLoggingSnapshotHTML() {
            const user = db.getUser(currentUser);
            const robotInfo = user.robot_info;
            const logs = user.logs || [];

            let headerText = `🤖 **${robotInfo[0] || '?'}** • 🗺 **${robotInfo[1] || '?'}**`;
            if (currentBranch) headerText += ` • 🌿 **${currentBranch}**`;
            if (currentStartTime) {
                const now = new Date();
                const currentTime = formatTimeWithoutSeconds(now);
                const duration = computeDuration(currentStartTime, currentTime);
                headerText += `
📅 ${stripSecondsFromTimeString(currentStartTime)} — ${currentTime} (${duration})`;
            }

            let logsHTML = '';
            logs.forEach(log => {
                if (typeof log === 'string') logsHTML += `<br>${log}`;
                else if (log.type === 'coords' && log.link) logsHTML += `<br><span class="coords-link" data-link="${log.link}">${log.shortText || log.text.split('     ')[0]}</span>`;
                else if (log.type === 'address') logsHTML += `<br><span class="address-text">${log.text}</span>`;
                else logsHTML += `<br>${JSON.stringify(log)}`;
            });

            return headerText + (logsHTML || '<br>(пока нет записей)');
        }

        function maybeTriggerAutoBackup() {
            if (!currentUser) return;
            const user = db.getUser(currentUser);
            ensureUserSettings(user);
            const interval = user.settings.autoBackupInterval || 0;
            if (interval <= 0) return;
            if (user.state !== 'logging') return;
            if (!user.logs || user.logs.length === 0) return;

            const confirmText = `💾 Авто-бэкап: сохранить текущий лог в TXT?

Интервал: ${interval} мин`;
            const confirmed = window.confirm(confirmText);
            if (!confirmed) return;

            const robot = user.robot_info?.[0] || 'robot';
            const route = user.robot_info?.[1] || 'route';
            const endTime = formatTimeWithoutSeconds(new Date());
            const content = formatLogsForExport(user.logs, robot, route, currentStartTime || endTime, endTime, currentBranch || null);
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${robot}_${route}_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);

            user.settings.autoBackupNextAt = new Date(Date.now() + interval * 60000).toISOString();
            db.save();
            addMessage('💾 Авто-бэкап сохранён', 'system');
        }

        function startLoggingTimers() {
            stopLoggingTimers();
            if (!currentUser) return;
            const user = db.getUser(currentUser);
            ensureUserSettings(user);

            if (user.state !== 'logging') {
                updateStats();
                return;
            }

            if (user.settings.autoBackupInterval > 0) {
                ensureAutoBackupSchedule(user);
            } else {
                user.settings.autoBackupNextAt = null;
                db.save();
            }

            loggingTickInterval = setInterval(() => {
                if (!currentUser) return;
                const activeUser = db.getUser(currentUser);
                ensureUserSettings(activeUser);

                if (activeUser.state !== 'logging') {
                    updateStats();
                    return;
                }

                renderLoggingSnapshot();
                updateStats();

                if (activeUser.settings.autoBackupInterval > 0) {
                    ensureAutoBackupSchedule(activeUser);
                    const nextAt = activeUser.settings.autoBackupNextAt ? new Date(activeUser.settings.autoBackupNextAt).getTime() : null;
                    if (nextAt && Date.now() >= nextAt) {
                        maybeTriggerAutoBackup();
                    }
                }
            }, 60000);

            updateStats();
        }

        function toggleSecondsInLogs() {
            if (!currentUser) return;
            const user = db.getUser(currentUser);
            ensureUserSettings(user);
            user.settings.showSecondsInLogs = !user.settings.showSecondsInLogs;
            db.save();
            addMessage(`🕒 Секунды в логах: ${user.settings.showSecondsInLogs ? 'ВКЛ' : 'ВЫКЛ'}`, 'system');
            if (user.state === 'logging') {
                renderLoggingSnapshot();
                updateStats();
            }
        }

        function toggleAutoBackup() {
            if (!currentUser) return;
            const user = db.getUser(currentUser);
            ensureUserSettings(user);

            const intervals = [0, 15, 30, 60, 120];
            const current = user.settings.autoBackupInterval || 0;
            const idx = intervals.indexOf(current);
            const next = intervals[(idx + 1) % intervals.length];

            user.settings.autoBackupInterval = next;
            user.settings.autoBackupNextAt = next > 0 ? new Date(Date.now() + next * 60000).toISOString() : null;
            db.save();

            addMessage(`⏳ Авто-бэкап: ${next === 0 ? 'ВЫКЛ' : `${next} мин`}`, 'system');
            updateStats();
        }

        const DEFAULT_COORDS_LINK = "https://yandex.ru/maps/?pt=38.617345,55.755826&z=16";

        // ============================================
        // КЛАСС ДЛЯ РАБОТЫ С ХРАНИЛИЩЕМ
        // ============================================
        class LocalDB {
            constructor() {
                this.loadData();
            }
            loadData() {
                const data = localStorage.getItem('robotLogger');
                if (data) {
                    this.data = JSON.parse(data);
                } else {
                    this.data = {
                        users: {},
                        currentUser: null
                    };
                    this.save();
                }
            }
            save() {
                localStorage.setItem('robotLogger', JSON.stringify(this.data));
            }
            getUsers() {
                return Object.keys(this.data.users);
            }
            getCurrentUser() {
                return this.data.currentUser;
            }
            setCurrentUser(login) {
                this.data.currentUser = login;
                this.save();
            }
            createUser(login) {
                if (!this.data.users[login]) {
                    this.data.users[login] = {
                        state: "welcome",
                        logs: [],
                        logs_archive: [],
                        robot_info: ["", ""],
                        robot_history: [[], []],
                        commands: JSON.parse(JSON.stringify(DEFAULT_COMMANDS)),
                        temporary: null,
                        editing_command: null,
                        coordinates: {
                            current: DEFAULT_COORDS_LINK,
                            last_input: DEFAULT_COORDS_TEXT,
                            coord_counter: 1,
                            address_counter: 1
                        },
                        settings: {
                            theme: "dark",
                            showSecondsInLogs: false,
                            autoBackupInterval: 0,
                            autoBackupNextAt: null
                        },
                        created: new Date().toISOString()
                    };
                    this.save();
                }
                return this.data.users[login];
            }
            getUser(login) {
                const user = this.data.users[login] || this.createUser(login);
                ensureUserSettings(user);
                return user;
            }
            setUser(login, key, value) {
                if (this.data.users[login]) {
                    this.data.users[login][key] = value;
                    this.save();
                }
            }
            saveCommands(login, commands) {
                if (this.data.users[login]) {
                    this.data.users[login].commands = commands;
                    this.save();
                }
            }
            parseCoordinates(input) {
                const cleanInput = input.trim();
                const ptMatch = cleanInput.match(/[?&]pt=([^&]+)/);
                if (ptMatch) {
                    let ptValue = decodeURIComponent(ptMatch[1]);
                    const coordsMatch = ptValue.match(/(-?\d+\.?\d*)\s*[, ]\s*(-?\d+\.?\d*)/);
                    if (coordsMatch) {
                        const lon = coordsMatch[1].trim();
                        const lat = coordsMatch[2].trim();
                        return { type: 'coords', lon: lon, lat: lat, fullLink: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16` };
                    }
                }
                const llMatch = cleanInput.match(/[?&]ll=([^&]+)/);
                if (llMatch) {
                    let llValue = decodeURIComponent(llMatch[1]);
                    const coordsMatch = llValue.match(/(-?\d+\.?\d*)\s*[, ]\s*(-?\d+\.?\d*)/);
                    if (coordsMatch) {
                        const lon = coordsMatch[1].trim();
                        const lat = coordsMatch[2].trim();
                        return { type: 'coords', lon: lon, lat: lat, fullLink: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16` };
                    }
                }
                const coordsMatch = cleanInput.match(/(-?\d+\.?\d*)\s*[, ]\s*(-?\d+\.?\d*)/);
                if (coordsMatch) {
                    const lat = coordsMatch[1].trim().replace(/[^\d.-]/g, '');
                    const lon = coordsMatch[2].trim().replace(/[^\d.-]/g, '');
                    return { type: 'coords', lon: lon, lat: lat, fullLink: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16` };
                }
                if (cleanInput.includes('yandex.ru/maps')) {
                    return { type: 'coords', lon: null, lat: null, fullLink: cleanInput.startsWith('http') ? cleanInput : `https://${cleanInput}` };
                }
                return { type: 'address', text: cleanInput };
            }
            updateCoordinates(login, input) {
                const user = this.getUser(login);
                const coords = user.coordinates;
                const parsed = this.parseCoordinates(input);
                const now = new Date();
                const timeStr = formatTimeForLog(now, user.settings.showSecondsInLogs);
                let logEntry;
                if (parsed.type === 'coords') {
                    const linkToSave = parsed.fullLink || DEFAULT_COORDS_LINK;
                    coords.current = linkToSave;
                    const coordNumber = coords.coord_counter;
                    const coordText = parsed.lon && parsed.lat ? `${parsed.lat}, ${parsed.lon}` : '';
                    logEntry = {
                        text: `${timeStr} Координаты_${coordNumber}     ${linkToSave}     ${coordText}`,
                        link: linkToSave,
                        shortText: `Координаты_${coordNumber}`,
                        type: 'coords'
                    };
                    coords.coord_counter += 1;
                    coords.last_input = coordText;
                } else {
                    logEntry = {
                        text: `${timeStr} Адрес_${coords.address_counter}: ${input}`,
                        link: null,
                        type: 'address'
                    };
                    coords.address_counter += 1;
                }
                const logs = [...user.logs, logEntry];
                this.data.users[login].logs = logs;
                this.save();
                return logEntry;
            }
            resetCounters(login) {
                if (this.data.users[login]) {
                    this.data.users[login].coordinates.coord_counter = 1;
                    this.data.users[login].coordinates.address_counter = 1;
                    this.save();
                }
            }
            toggleTheme(login) {
                if (this.data.users[login]) {
                    const current = this.data.users[login].settings.theme;
                    this.data.users[login].settings.theme = current === 'dark' ? 'light' : 'dark';
                    this.save();
                    return this.data.users[login].settings.theme;
                }
                return 'dark';
            }
        }
        
        // ============================================

        // ============================================
        // DRAG & DROP
        // ============================================
        let dragState = { active: false, sourceIndex: null, startX: 0, startY: 0, clone: null, targetIndex: null };
        
        function startDrag(e, btn, idx) {
            if (!editMode) return;
            e.preventDefault();
            if (dragState.active) return;
            dragState.active = true;
            dragState.sourceIndex = idx;
            dragState.targetIndex = null;
            const rect = btn.getBoundingClientRect();
            dragState.startX = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - rect.left;
            dragState.startY = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - rect.top;
            dragState.clone = btn.cloneNode(true);
            dragState.clone.classList.add('dragging-clone');
            dragState.clone.style.position = 'fixed';
            dragState.clone.style.left = rect.left + 'px';
            dragState.clone.style.top = rect.top + 'px';
            dragState.clone.style.width = rect.width + 'px';
            dragState.clone.style.height = rect.height + 'px';
            dragState.clone.style.margin = '0';
            dragState.clone.style.opacity = '0.7';
            document.body.appendChild(dragState.clone);
            btn.style.opacity = '0.4';
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchmove', onDragMove);
            document.addEventListener('touchend', onDragEnd);
        }
        
        function onDragMove(e) {
            if (!dragState.active) return;
            e.preventDefault();
            let clientX = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
            let clientY = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
            if (dragState.clone) {
                dragState.clone.style.left = (clientX - dragState.startX) + 'px';
                dragState.clone.style.top = (clientY - dragState.startY) + 'px';
            }
            const elemUnderCursor = document.elementsFromPoint(clientX, clientY);
            let targetBtn = null;
            for (let el of elemUnderCursor) {
                if (el.classList && el.classList.contains('drag-button') && el !== dragState.clone && el.style.opacity !== '0.4') {
                    targetBtn = el;
                    break;
                }
            }
            if (targetBtn) {
                const newIdx = parseInt(targetBtn.getAttribute('data-idx'));
                if (!isNaN(newIdx) && dragState.targetIndex !== newIdx) {
                    if (dragState.targetIndex !== null) {
                        const prev = document.querySelector(`.drag-button[data-idx="${dragState.targetIndex}"]`);
                        if (prev) prev.classList.remove('drag-over');
                    }
                    dragState.targetIndex = newIdx;
                    targetBtn.classList.add('drag-over');
                }
            } else {
                if (dragState.targetIndex !== null) {
                    const prev = document.querySelector(`.drag-button[data-idx="${dragState.targetIndex}"]`);
                    if (prev) prev.classList.remove('drag-over');
                    dragState.targetIndex = null;
                }
            }
        }
        
        function onDragEnd(e) {
            if (!dragState.active) return;
            e.preventDefault();
            if (dragState.clone) dragState.clone.remove();
            const sourceBtn = document.querySelector(`.drag-button[data-idx="${dragState.sourceIndex}"]`);
            if (sourceBtn) sourceBtn.style.opacity = '';
            if (dragState.targetIndex !== null && dragState.targetIndex !== dragState.sourceIndex) {
                const user = db.getUser(currentUser);
                const commands = [...user.commands];
                const [moved] = commands.splice(dragState.sourceIndex, 1);
                commands.splice(dragState.targetIndex, 0, moved);
                db.saveCommands(currentUser, commands);
                addMessage(`🔄 Порядок кнопок изменён: "${moved.name}" перемещена`, 'system');
                if (user.state === 'logging') showLoggingScreen();
            }
            if (dragState.targetIndex !== null) {
                const target = document.querySelector(`.drag-button[data-idx="${dragState.targetIndex}"]`);
                if (target) target.classList.remove('drag-over');
            }
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchmove', onDragMove);
            document.removeEventListener('touchend', onDragEnd);
            dragState.active = false;
            dragState.sourceIndex = null;
            dragState.targetIndex = null;
        }
        
        // ============================================
        // УПРАВЛЕНИЕ РАЗДЕЛИТЕЛЕМ
        // ============================================
        let isResizing = false;
        let startY = 0;
        let startLogsHeight = 0;
        const resizableArea = document.getElementById('resizableArea');
        const logsContainer = document.getElementById('logsContainer');
        const splitter = document.getElementById('splitter');
        
        function initSplitter() {
            const savedHeight = localStorage.getItem('logsContainerHeight');
            if (savedHeight && logsContainer) {
                const height = parseInt(savedHeight);
                if (!isNaN(height) && height > 100) {
                    logsContainer.style.height = height + 'px';
                    logsContainer.style.flex = 'none';
                }
            }
            splitter.addEventListener('mousedown', startResize);
            splitter.addEventListener('touchstart', startResize);
            document.addEventListener('mousemove', doResize);
            document.addEventListener('touchmove', doResize);
            document.addEventListener('mouseup', stopResize);
            document.addEventListener('touchend', stopResize);
        }
        
        function startResize(e) {
            isResizing = true;
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            const rect = logsContainer.getBoundingClientRect();
            startLogsHeight = rect.height;
            document.body.classList.add('resizing-active');
            splitter.classList.add('active');
            e.preventDefault();
        }
        
        function doResize(e) {
            if (!isResizing) return;
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            if (currentY === undefined) return;
            const deltaY = currentY - startY;
            let newLogsHeight = startLogsHeight + deltaY;
            const minLogsHeight = 100;
            const minBottomHeight = 150;
            const totalHeight = resizableArea.getBoundingClientRect().height;
            const maxLogsHeight = totalHeight - minBottomHeight;
            newLogsHeight = Math.max(minLogsHeight, Math.min(maxLogsHeight, newLogsHeight));
            logsContainer.style.height = newLogsHeight + 'px';
            logsContainer.style.flex = 'none';
            e.preventDefault();
        }
        
        function stopResize() {
            if (isResizing) {
                isResizing = false;
                document.body.classList.remove('resizing-active');
                splitter.classList.remove('active');
                if (logsContainer.style.height) {
                    localStorage.setItem('logsContainerHeight', logsContainer.style.height);
                }
            }
        }

        function copyCurrentReport() {
            const user = db.getUser(currentUser);

            const logs = user.logs || [];

            if (currentBranch) header += ` • 🌿 **${currentBranch}**`;
            if (currentStartTime) {
                const endTime = currentEndTime ? currentEndTime : formatTimeWithoutSeconds(new Date());
                const duration = computeDuration(currentStartTime, endTime);
                header += `\n📅 ${stripSecondsFromTimeString(currentStartTime)} — ${stripSecondsFromTimeString(endTime)} = ${duration}`;
            } else {
                header += `\n📅 ${formatTimeWithoutSeconds(new Date())}`;

            header += `\n\n`;
            
            let body = '';
            logs.forEach(log => {
                if (typeof log === 'string') body += log + "\n";
                else if (log.type === 'coords' && log.link) body += `${log.text}\n`;
                else if (log.type === 'address') body += `${log.text}\n`;
                else body += JSON.stringify(log) + "\n";
            });
            
            const report = header + body;
            navigator.clipboard.writeText(report).then(() => {
                addMessage("📋 Отчет скопирован в буфер обмена.", "system");
            }).catch(() => {
                addMessage("❌ Не удалось скопировать отчет.", "system");

        // ============================================
        // АРХИВ И ЭКСПОРТ
        // ============================================
        function formatLogsForExport(logs, robot, route, startTime, endTime, branch) {
            let header = `Лог проезда\nРобот: ${robot}\nМаршрут: ${route}`;
            if (branch) header += `\nВетка: ${branch}`;
            header += `\nНачало: ${startTime}\nОкончание: ${endTime}\nПродолжительность: ${computeDuration(startTime, endTime)}\n\n`;
            const body = logs.map(log => {
                if (typeof log === 'string') return log;
                if (log && log.text) return log.text;
                return JSON.stringify(log);
            }).join('\n');
            return header + body;
        }
        
        function handleShowLastLog() {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            if (archive.length === 0) {
                addMessage('❌ Нет сохраненных проездов', 'error');
                showKeyboard([[{ text: '◀️ Назад', callback: () => handleMainMenu() }]]);
            } else {
                const lastLog = archive[0];
                const logsText = lastLog.slice(0, -1).map(log => {
                    if (typeof log === 'string') return log;
                    if (log && log.text) return log.text;
                    return JSON.stringify(log);
                }).join('\n');
                const footer = lastLog[lastLog.length - 1];
                const branch = footer[4] ? `\nВетка: ${footer[4]}` : '';
                const header = `🤖 **${footer[0]}** • 🗺 **${footer[1]}**${branch}\n📅 ${stripSecondsFromTimeString(footer[2])} — ${stripSecondsFromTimeString(footer[3])} (${computeDuration(footer[2], footer[3])})\n\n`;
                addMessage(header + logsText, 'system');
                showKeyboard([
                    [{ text: '📥 Экспорт в TXT', callback: () => exportLastLog() }],
                    [{ text: '◀️ Назад', callback: () => handleMainMenu() }]
                ]);
            }
        }
        
        function exportLastLog() {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            if (archive.length === 0) return;
            const lastLog = archive[0];
            const logs = lastLog.slice(0, -1);
            const footer = lastLog[lastLog.length - 1];
            const branch = footer[4] || null;
            const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3], branch);
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const duration = computeDuration(footer[2], footer[3]);
            a.download = `log_${footer[0]}_${footer[1]}_${stripSecondsFromTimeString(footer[2]).replace(/:/g,'-')}_${duration.replace(/[^а-яa-z0-9]/gi, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            addMessage('📥 Последний лог экспортирован', 'system');
        }
        
        function handleShowArchive() {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            if (archive.length === 0) {
                addMessage('❌ Архив пуст', 'error');

            }
            let text = '📑 **Архив проездов**\n\n';
            const buttons = [];
            archive.forEach((entry, i) => {
                const footer = entry[entry.length - 1];

            const checkboxes = [];
            archive.forEach((entry, i) => {

        async function exportSelectedArchive(checkboxes) {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            const selectedIndices = [];
            checkboxes.forEach((cb, idx) => { if (cb.checked) selectedIndices.push(idx); });
            if (selectedIndices.length === 0) {
                addMessage('❌ Ничего не выбрано', 'system');
                handleShowArchive();
                return;
            }
            const zip = new JSZip();
            selectedIndices.forEach(idx => {
                const entry = archive[idx];
                const logs = entry.slice(0, -1);
                const footer = entry[entry.length - 1];
                const branch = footer[4] || null;
                const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3], branch);
                const duration = computeDuration(footer[2], footer[3]);
                const filename = `log_${footer[0]}_${footer[1]}_${footer[2].replace(/:/g,'-')}_${duration.replace(/[^а-яa-z0-9]/gi, '_')}.txt`;
                zip.file(filename, content);
            });
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `archive_${currentUser}_${new Date().toISOString().slice(0,10)}.zip`;
            a.click();
            URL.revokeObjectURL(url);
            addMessage(`📦 Экспортировано проездов: ${selectedIndices.length}`, 'system');
            handleShowArchive();
        }
        
        function handleViewArchiveItem(index) {
            const user = db.getUser(currentUser);
            const entry = user.logs_archive[index];
            const logsText = entry.slice(0, -1).map(log => {
                if (typeof log === 'string') return log;
                if (log && log.text) return log.text;
                return JSON.stringify(log);
            }).join('\n');
            const footer = entry[entry.length - 1];
            const branch = footer[4] ? `\nВетка: ${footer[4]}` : '';
            const duration = computeDuration(footer[2], footer[3]);
            const header = `🤖 **${footer[0]}** • 🗺 **${footer[1]}**${branch}\n📅 ${stripSecondsFromTimeString(footer[2])} — ${stripSecondsFromTimeString(footer[3])} (${duration})\n\n`;
            addMessage('📄 **Архивный лог**\n\n' + header + logsText, 'system');
            showKeyboard([
                [{ text: '📥 Экспорт в TXT', callback: () => exportArchiveItem(index) }],
                [{ text: '◀️ Назад в архив', callback: () => handleShowArchive() }]
            ]);
        }
        
        function exportArchiveItem(index) {
            const user = db.getUser(currentUser);
            const entry = user.logs_archive[index];
            const logs = entry.slice(0, -1);
            const footer = entry[entry.length - 1];
            const branch = footer[4] || null;
            const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3], branch);
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const duration = computeDuration(footer[2], footer[3]);
            a.download = `log_${footer[0]}_${footer[1]}_${stripSecondsFromTimeString(footer[2]).replace(/:/g,'-')}_${duration.replace(/[^а-яa-z0-9]/gi, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            addMessage('📥 Лог экспортирован', 'system');
        }
        
        // ============================================
        // НАСТРОЙКИ КОМАНД
        // ============================================
        function handleUserCommands() {
            if (!currentUser) return;
            const user = db.getUser(currentUser);
            ensureUserSettings(user);
            const commands = user.commands;
            let helpText = `⚙️ **Настройки**

• ➕ Добавить команду
• ✏️ Редактировать
• ❌ Удалить
• 🔄 Сбросить
• 📤 Экспорт
• 📥 Импорт
• ◀️ Назад

**Текущие команды:**
`;
            commands.forEach((cmd, i) => { helpText += `${i+1}. ${cmd.name}
`; });
            helpText += `
🕒 Секунды в логах: ${user.settings.showSecondsInLogs ? 'ВКЛ' : 'ВЫКЛ'}`;
            helpText += `
⏳ Авто-бэкап: ${user.settings.autoBackupInterval ? `${user.settings.autoBackupInterval} мин` : 'ВЫКЛ'}`;
            addMessage(helpText, 'system');
            showKeyboard([
                [{ text: user.settings.showSecondsInLogs ? '🕒 Секунды: ВКЛ' : '🕒 Секунды: ВЫКЛ', callback: () => toggleSecondsInLogs() }],
                [{ text: `⏳ Авто-бэкап${user.settings.autoBackupInterval ? `: ${user.settings.autoBackupInterval} мин` : ''}`, callback: () => toggleAutoBackup() }],
                [{ text: '➕ Добавить команду', callback: () => handleUserAddStart() }],
                [{ text: '✏️ Редактировать команду', callback: () => handleUserEditStart() }],
                [{ text: '❌ Удалить команду', callback: () => handleUserDeleteStart() }],
                [{ text: '🔄 Сбросить к стандартным', callback: () => handleUserReset() }],
                [{ text: '📤 Экспорт команд', callback: () => exportCommands() }],
                [{ text: '📥 Импорт команд', callback: () => importCommands() }],
                [{ text: '◀️ Назад', callback: () => handleMainMenu() }]
            ]);
            db.setUser(currentUser, 'state', 'commands_menu');
        }
        
        function exportCommands() {
            if (!currentUser) return;
            const user = db.getUser(currentUser);
            const commands = user.commands;
            const dataStr = JSON.stringify(commands, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `commands_${currentUser}_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            addMessage('📤 Команды экспортированы', 'system');
        }
        
        function importCommands() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json';
            input.onchange = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!Array.isArray(imported) || !imported.every(cmd => cmd.name && cmd.log_text)) throw new Error('Неверный формат');
                        db.saveCommands(currentUser, imported);
                        addMessage('✅ Команды импортированы', 'system');
                        handleUserCommands();
                    } catch (err) {
                        addMessage(`❌ Ошибка: ${err.message}`, 'system');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        
        function handleUserAddStart() {
            addMessage('✏️ Введите **название** новой команды:', 'system');
            showInput('Название команды...');
            db.setUser(currentUser, 'state', 'user_add_name');
        }
        
        function handleUserAddName(text) {
            db.setUser(currentUser, 'temporary', { name: text });
            addMessage('✏️ Введите **текст для лога** (можно с эмодзи):', 'system');
            showInput('Текст лога...');
            db.setUser(currentUser, 'state', 'user_add_log');
        }
        
        function handleUserAddLog(text) {
            const user = db.getUser(currentUser);
            const temp = user.temporary;
            if (temp && temp.name) {
                const commands = [...user.commands];
                commands.push({ name: temp.name, log_text: text });
                db.saveCommands(currentUser, commands);
                addMessage(`✅ Команда **'${temp.name}'** добавлена!`, 'system');
            }
            handleUserCommands();
        }
        
        function handleUserDeleteStart() {
            const user = db.getUser(currentUser);
            const commands = user.commands;
            if (commands.length === 0) {
                addMessage('❌ Нет команд для удаления', 'error');
                handleUserCommands();
                return;
            }
            addMessage('❌ **Выберите команду для удаления:**', 'system');
            const buttons = commands.map((cmd, i) => [{ text: `${i+1}. ${cmd.name}`, callback: () => handleUserDeleteConfirm(i) }]);
            buttons.push([{ text: '◀️ Назад', callback: () => handleUserCommands() }]);
            showKeyboard(buttons);
        }
        
        function handleUserDeleteConfirm(index) {
            showKeyboard([
                [{ text: '✅ Да, удалить', class: 'danger', callback: () => handleUserDeleteExecute(index) }],
                [{ text: '❌ Нет, отмена', callback: () => handleUserDeleteStart() }]
            ]);
        }
        
        function handleUserDeleteExecute(index) {
            const user = db.getUser(currentUser);
            const commands = [...user.commands];
            const removed = commands.splice(index, 1)[0];
            db.saveCommands(currentUser, commands);
            addMessage(`✅ Команда **'${removed.name}'** удалена!`, 'system');
            handleUserCommands();
        }
        
        function handleUserEditStart() {
            const user = db.getUser(currentUser);
            const commands = user.commands;
            if (commands.length === 0) {
                addMessage('❌ Нет команд для редактирования', 'error');
                handleUserCommands();
                return;
            }
            addMessage('✏️ **Выберите команду для редактирования:**', 'system');
            const buttons = commands.map((cmd, i) => [{ text: `${i+1}. ${cmd.name}`, callback: () => handleUserEditSelect(i) }]);
            buttons.push([{ text: '◀️ Назад', callback: () => handleUserCommands() }]);
            showKeyboard(buttons);
        }
        
        function handleUserEditSelect(index) {
            const user = db.getUser(currentUser);
            const cmd = user.commands[index];
            db.setUser(currentUser, 'editing_command', index);
            addMessage(`Редактирование: **${cmd.name}**\n\nТекущий текст лога: ${cmd.log_text}\n\nВведите **новый текст** для лога:`, 'system');
            showInput('Новый текст лога...');
            db.setUser(currentUser, 'state', 'user_edit_log');
        }
        
        function handleUserEditLog(text) {
            const user = db.getUser(currentUser);
            const idx = user.editing_command;
            if (idx !== null && idx >= 0 && idx < user.commands.length) {
                const commands = [...user.commands];
                const oldName = commands[idx].name;
                commands[idx].log_text = text;
                db.saveCommands(currentUser, commands);
                addMessage(`✅ Команда **'${oldName}'** обновлена!`, 'system');
            }
            handleUserCommands();
        }
        
        function handleUserReset() {
            showKeyboard([
                [{ text: '✅ Да, сбросить', class: 'danger', callback: () => handleUserResetConfirm() }],
                [{ text: '❌ Нет, отмена', callback: () => handleUserCommands() }]
            ]);
        }
        
        function handleUserResetConfirm() {
            db.saveCommands(currentUser, JSON.parse(JSON.stringify(DEFAULT_COMMANDS)));
            addMessage('✅ Команды сброшены к стандартному набору!', 'system');
            handleUserCommands();
        }
        
        // ============================================
        // ОБРАБОТКА СООБЩЕНИЙ
        // ============================================
        function sendMessage() {
            if (!currentUser) {
                addMessage('❌ Сначала выберите пользователя', 'error');
                return;
            }
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const user = db.getUser(currentUser);
            const state = user.state;
            if (state === 'awaiting_robot') handleSelectRobot(text);
            else if (state === 'awaiting_route') handleSelectRoute(text);
            else if (state === 'awaiting_coordinates') handleSaveCoordinates(text);
            else if (state === 'logging') {
                const now = new Date();
                const timeStr = formatTimeForLog(now, user.settings.showSecondsInLogs);
                const logs = [...user.logs, `${timeStr} ${text}`];
                db.setUser(currentUser, 'logs', logs);
                updateStats();
                showLoggingScreen();
            } else if (state === 'user_add_name') handleUserAddName(text);
            else if (state === 'user_add_log') handleUserAddLog(text);
            else if (state === 'user_edit_log') handleUserEditLog(text);
            else if (state === 'tech_branch') {
                processTechInput(text, 'branch');
                db.setUser(currentUser, 'state', 'logging');
            } else if (state === 'tech_comment') {
                processTechInput(text, 'comment');
                db.setUser(currentUser, 'state', 'logging');
            } else if (state === 'tech_other') {
                processTechInput(text, 'other');
                db.setUser(currentUser, 'state', 'logging');
            } else handleMainMenu();
            if (window.innerWidth <= 600) input.blur();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // ============================================
        // ПОЛНЫЙ БЭКАП И ОЧИСТКА
        // ============================================
        function generateReadme() {
            return `ЛОГГЕР ДЛЯ РОБОТОВ - ПОЛНЫЙ БЭКАП ДАННЫХ\nДата создания: ${new Date().toLocaleString()}\n\nСтруктура архива...`;
        }
        
        async function handleFullBackupNoUser() {
            addMessage('💾 Создание полного бэкапа...', 'system');
            const users = db.getUsers();
            const zip = new JSZip();
            const metadata = { exportDate: new Date().toISOString(), version: "1.0", users: users, totalLogs: 0 };
            for (const login of users) {
                const userData = db.getUser(login);
                const userFolder = zip.folder(`users/${login}`);
                userFolder.file('commands.json', JSON.stringify(userData.commands, null, 2));
                userFolder.file('settings.json', JSON.stringify({ theme: userData.settings.theme, coordinates: userData.coordinates, robot_history: userData.robot_history }, null, 2));
                userFolder.file('archive.json', JSON.stringify(userData.logs_archive, null, 2));
                const logsFolder = userFolder.folder('logs_export');
                userData.logs_archive.forEach((entry, idx) => {
                    const footer = entry[entry.length - 1];
                    const logs = entry.slice(0, -1);
                    const branch = footer[4] || null;
                    const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3], branch);
                    const filename = `proezd_${idx+1}_${footer[0]}_${footer[1]}_${footer[2].replace(/:/g,'-')}.txt`;
                    logsFolder.file(filename, content);
                    metadata.totalLogs++;
                });
            }
            zip.file('metadata.json', JSON.stringify(metadata, null, 2));
            zip.file('README.txt', generateReadme());
            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.zip`;
            a.click();
            URL.revokeObjectURL(url);
            addMessage(`✅ Полный бэкап создан: ${metadata.totalLogs} проездов`, 'system');
        }
        
        function handleClearCacheNoUser() {
            addMessage('⚠️ **ВНИМАНИЕ! Необратимое действие!**\n\nБудут безвозвратно удалены все данные.\nДля подтверждения введите **DELETE** в поле ниже:', 'system');
            showInput('Введите DELETE для подтверждения...');
            document.getElementById('globalActions').classList.add('hidden');
            showKeyboard([
                [
                    { text: '✅ Подтвердить удаление', class: 'danger', callback: () => executeClearCacheNoUser() },
                    { text: '❌ Отмена', callback: () => {
                        hideInput();
                        clearKeyboard();
                        document.getElementById('globalActions').classList.remove('hidden');
                    }}
                ]
            ]);
        }
        
        function executeClearCacheNoUser() {
            const input = document.getElementById('messageInput').value.trim();
            if (input === 'DELETE') {
                localStorage.clear();
                addMessage('🗑️ Все данные удалены. Перезагрузка...', 'system');
                setTimeout(() => location.reload(), 2000);
            } else {
                addMessage('❌ Неверное подтверждение. Операция отменена.', 'system');
                hideInput();
                clearKeyboard();
                document.getElementById('globalActions').classList.remove('hidden');
            }
        }
        
        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        window.onload = function() {
            loadUsers();
            initSplitter();
            
            const savedUser = db.getCurrentUser();
            if (savedUser && db.getUsers().includes(savedUser)) {
                document.getElementById('userSelect').value = savedUser;
                switchUser();
            } else {
                document.getElementById('globalActions').classList.remove('hidden');
                document.getElementById('userSelector').classList.remove('hidden');
            }
            if (db.getUsers().length === 0) {
                db.createUser('Оператор_1');
                db.createUser('Оператор_2');
                loadUsers();
            }
        };
    </script>
</body>
</html>
