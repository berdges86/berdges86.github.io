<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Логгер для роботов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.2s;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            padding: 1vh 1vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: #1a1a1a;
        }
        
        /* Адаптивные размеры через vh/vw и проценты */
        :root {
            --header-height: 8vh;
            --selector-height: 7vh;
            --input-height: 7vh;
            --keyboard-max-height: 30vh;
            --stats-height: 4vh;
            --global-actions-height: 7vh;
            --spacing: 1vh;
            --border-radius: 2vw;
            --font-size-large: min(3.5vh, 5vw);
            --font-size-medium: min(2.5vh, 4vw);
            --font-size-small: min(2vh, 3.5vw);
        }
        
        /* Темная тема (по умолчанию) */
        body.dark-theme {
            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        body.dark-theme .container {
            background: #2d2d2d;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        body.dark-theme .header {
            background: #3d3d3d;
            border-bottom-color: #4a4a4a;
        }
        
        body.dark-theme .message {
            background: #3d3d3d;
        }
        
        body.dark-theme .button-row button {
            background: #4a4a4a;
            color: #fff;
        }
        
        body.dark-theme .button-row button:hover {
            background: #5a5a5a;
        }
        
        body.dark-theme .button-row button.primary {
            background: #4CAF50;
        }
        
        body.dark-theme .button-row button.danger {
            background: #f44336;
        }
        
        body.dark-theme .input-group input {
            background: #2d2d2d;
            color: #fff;
            border-color: #4a4a4a;
        }
        
        /* Светлая тема */
        body.light-theme {
            background: #f0f2f5;
            color: #1a1a1a;
        }
        
        body.light-theme .container {
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        body.light-theme .header {
            background: #f8f9fa;
            border-bottom-color: #dee2e6;
        }
        
        body.light-theme .message {
            background: #f8f9fa;
        }
        
        body.light-theme .button-row button {
            background: #e9ecef;
            color: #1a1a1a;
        }
        
        body.light-theme .button-row button:hover {
            background: #dee2e6;
        }
        
        body.light-theme .button-row button.primary {
            background: #0d6efd;
            color: white;
        }
        
        body.light-theme .button-row button.danger {
            background: #dc3545;
            color: white;
        }
        
        body.light-theme .input-group input {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #dee2e6;
        }
        
        .container {
            width: 100%;
            height: 98vh;
            max-width: 1400px;
            border-radius: var(--border-radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #2d2d2d;
            position: relative;
        }
        
        .header {
            padding: var(--spacing) min(3vw, 20px);
            height: var(--header-height);
            min-height: var(--header-height);
            border-bottom: 1px solid;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .header h1 {
            font-size: var(--font-size-large);
            line-height: 1.2;
        }
        
        .header .user-info {
            font-size: var(--font-size-small);
            opacity: 0.8;
            margin-top: 0.2vh;
        }
        
        .user-selector {
            padding: var(--spacing) min(3vw, 20px);
            height: var(--selector-height);
            min-height: var(--selector-height);
            display: flex;
            gap: 1vw;
            align-items: center;
            border-bottom: 1px solid;
            flex-shrink: 0;
        }
        
        .user-selector select {
            flex: 2;
            height: 70%;
            padding: 0 2vw;
            border: 1px solid;
            border-radius: 1vw;
            background: inherit;
            color: inherit;
            font-size: var(--font-size-medium);
        }
        
        .user-selector button {
            flex: 1;
            height: 70%;
            padding: 0 1vw;
            border: none;
            border-radius: 1vw;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            white-space: nowrap;
            font-size: var(--font-size-small);
        }
        
        .content {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: var(--spacing) min(3vw, 20px);
            min-height: 20vh;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            border-radius: 1.5vw;
            padding: min(1.5vh, 15px) min(2vw, 15px);
            margin-bottom: var(--spacing);
            border-left: 0.5vw solid #4CAF50;
            font-size: var(--font-size-medium);
        }
        
        .message.system {
            border-left-color: #FFC107;
        }
        
        .message .time {
            font-size: var(--font-size-small);
            opacity: 0.6;
            margin-bottom: 0.5vh;
        }
        
        .message .text {
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .keyboard {
            flex-shrink: 0;
            max-height: var(--keyboard-max-height);
            overflow-y: auto;
            padding: var(--spacing) min(3vw, 20px);
            border-top: 1px solid;
            -webkit-overflow-scrolling: touch;
        }
        
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
        }
        
        .button-row {
            display: flex;
            gap: 1vw;
            flex-wrap: wrap;
        }
        
        .button-row button {
            flex: 1 1 calc(50% - 1vw);
            min-width: 40%;
            padding: min(1.5vh, 12px) min(2vw, 12px);
            border: none;
            border-radius: 1.5vw;
            cursor: pointer;
            font-size: var(--font-size-medium);
            word-break: break-word;
            white-space: normal;
            line-height: 1.2;
        }
        
        .button-row button.primary {
            color: white;
        }
        
        .button-row button.danger {
            color: white;
        }
        
        .input-area {
            flex-shrink: 0;
            padding: var(--spacing) min(3vw, 20px);
            border-top: 1px solid;
            background: inherit;
        }
        
        .input-group {
            display: flex;
            gap: 1vw;
            height: 100%;
        }
        
        .input-group input {
            flex: 1;
            height: var(--input-height);
            padding: 0 min(2vw, 12px);
            border: 1px solid;
            border-radius: 1.5vw;
            font-size: var(--font-size-medium);
            background: inherit;
            color: inherit;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        .input-group button {
            height: var(--input-height);
            padding: 0 min(3vw, 24px);
            border: none;
            border-radius: 1.5vw;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: var(--font-size-medium);
            white-space: nowrap;
        }
        
        .stats {
            flex-shrink: 0;
            height: var(--stats-height);
            min-height: var(--stats-height);
            padding: 0 min(3vw, 20px);
            font-size: var(--font-size-small);
            opacity: 0.6;
            text-align: center;
            border-top: 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .global-actions {
            flex-shrink: 0;
            height: var(--global-actions-height);
            min-height: var(--global-actions-height);
            padding: var(--spacing) min(3vw, 20px);
            display: flex;
            gap: 1vw;
            border-top: 1px solid;
        }
        
        .global-actions button {
            flex: 1;
            height: 100%;
            padding: 0 min(1vw, 12px);
            border: none;
            border-radius: 1.5vw;
            cursor: pointer;
            font-size: var(--font-size-medium);
            font-weight: 500;
            white-space: nowrap;
        }
        
        .global-actions button.primary {
            background: #4CAF50;
            color: white;
        }
        
        .global-actions button.danger {
            background: #f44336;
            color: white;
        }
        
        .hidden {
            display: none !important;
        }
        
        .coords-link {
            color: #4CAF50;
            font-weight: bold;
            text-decoration: underline dotted;
            cursor: pointer;
        }
        
        .coords-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        
        .address-text {
            color: inherit;
            font-weight: bold;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 1vw;
            padding: min(1vh, 8px);
            background: inherit;
            border: 1px solid;
            border-radius: 1vw;
            margin-bottom: 0.5vh;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: min(4vh, 20px);
            height: min(4vh, 20px);
            cursor: pointer;
        }
        
        .checkbox-item label {
            flex: 1;
            cursor: pointer;
            font-size: var(--font-size-small);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Специальные стили для мобильных устройств */
        @media (max-width: 600px) {
            :root {
                --header-height: 7vh;
                --selector-height: 8vh;
                --input-height: 6vh;
                --keyboard-max-height: 35vh;
                --stats-height: 4vh;
                --global-actions-height: 7vh;
                --spacing: 0.8vh;
                --border-radius: 3vw;
                --font-size-large: min(4vh, 6vw);
                --font-size-medium: min(3vh, 4.5vw);
                --font-size-small: min(2.5vh, 3.5vw);
            }
            
            body {
                padding: 0;
            }
            
            .container {
                height: 100vh;
                width: 100vw;
                max-width: none;
                border-radius: 0;
            }
            
            .button-row button {
                flex: 1 1 100%;
                min-width: 100%;
                padding: 1.5vh min(3vw, 15px);
            }
            
            .user-selector {
                flex-wrap: wrap;
                height: auto;
                min-height: auto;
                padding: 1vh min(3vw, 15px);
            }
            
            .user-selector select,
            .user-selector button {
                height: 5vh;
                font-size: var(--font-size-medium);
            }
            
            .global-actions {
                height: auto;
                min-height: auto;
                padding: 1vh min(3vw, 15px);
            }
            
            .global-actions button {
                height: 6vh;
                font-size: var(--font-size-medium);
                white-space: normal;
                padding: 0 2vw;
            }
            
            .input-group {
                flex-direction: row;
            }
            
            .input-group button {
                padding: 0 4vw;
            }
            
            .keyboard {
                max-height: 40vh;
            }
        }

        /* Адаптация при открытой клавиатуре на мобильных */
        @media (max-width: 600px) and (max-height: 500px) {
            :root {
                --header-height: 10vh;
                --keyboard-max-height: 30vh;
                --input-height: 8vh;
            }
            
            .header h1 {
                font-size: var(--font-size-medium);
            }
            
            .message {
                padding: 0.8vh 2vw;
                margin-bottom: 0.5vh;
            }
            
            .button-row button {
                padding: 1vh 2vw;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <div class="container">
        <div class="header">
            <h1>🤖 Логгер для роботов</h1>
            <div class="user-info" id="userInfo"></div>
        </div>
        
        <div class="user-selector" id="userSelector">
            <select id="userSelect">
                <option value="">Выберите пользователя...</option>
            </select>
            <button onclick="addNewUser()">➕ Новый</button>
            <button onclick="switchUser()">🔑 Войти</button>
        </div>
        
        <div class="content" id="chatContent">
            <div class="message system">
                <div class="time"></div>
                <div class="text">Добро пожаловать! Выберите пользователя для начала работы.</div>
            </div>
        </div>
        
        <div class="input-area hidden" id="inputArea">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Отпр</button>
            </div>
        </div>
        
        <div class="keyboard" id="keyboardArea"></div>
        
        <div class="stats" id="stats"></div>

        <div class="global-actions" id="globalActions">
            <button class="primary" onclick="handleFullBackupNoUser()">💾 Экспорт</button>
            <button class="danger" onclick="handleClearCacheNoUser()">🗑️ Очистка</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        // ============================================
        // КОМАНДЫ ПО УМОЛЧАНИЮ
        // ============================================
        const DEFAULT_COMMANDS = [
            {"name": "🚀 Начало маршрута", "log_text": "Начало маршрута"},
            {"name": "🎮 Ручное управление", "log_text": "Ручное управление"},
            {"name": "🚧 Проблемы с препятствиями", "log_text": "Проблемы с препятствиями"},
            {"name": "🚗 Пропуск автомобиля", "log_text": "Пропуск автомобиля"},
            {"name": "🚶 Пропуск пешехода/коляски", "log_text": "Пропуск пешехода/коляски"},
            {"name": "🚙 Пропуск иного ТС", "log_text": "Пропуск иного ТС"},
            {"name": "🤖 Пропуск иного агента", "log_text": "Пропуск иного агента"},
            {"name": "↪️ Переход РПП", "log_text": "Переход РПП"},
            {"name": "↩️ Переход ПП", "log_text": "Переход ПП"},
            {"name": "⏸ Остановка без причины", "log_text": "Остановка без причины"},
            {"name": "🔄 Манёвры на месте", "log_text": "Манёвры на месте"},
            {"name": "📳 Рывки/дерганья/виляние", "log_text": "Рывки/дерганья/виляние"},
            {"name": "↪️ Сход с маршрута", "log_text": "Сход с маршрута"},
            {"name": "👆 Случайное нажатие", "log_text": "Случайное нажатие"},
            {"name": "⚠️ Инцедент", "log_text": "Инцидент"},
            {"name": "🔴 Крит", "log_text": "Крит"},
            {"name": "🔴 Крит по КС", "log_text": "Крит по КС"},
            {"name": "📡 Смена частоты WIFI", "log_text": "Смена частоты WiFi"},
            {"name": "⏸️ Пауза в прохождении маршрута", "log_text": "Пауза в прохождении маршрута"},
            {"name": "⚠️ Опасный маневр/подстраховка", "log_text": "Опасный маневр/подстраховка"},
            {"name": "🌾 Проблемы с Кропом", "log_text": "Проблемы с Кропом"},
            {"name": "📷 Проблемы с камерами", "log_text": "Проблемы с камерами"},
            {"name": "✅ Approve danger polygon / traffic lights", "log_text": "Approve danger polygon / traffic lights"},
            {"name": "🏁 Завершение маршрута", "log_text": "Завершение маршрута"}
        ];

        // ============================================
        // КОНСТАНТЫ
        // ============================================
        const DEFAULT_COORDS_LINK = "https://yandex.ru/maps/?pt=38.617345,55.755826&z=16";
        const DEFAULT_COORDS_TEXT = "55.755826, 38.617345";
        const MAX_ARCHIVE_SIZE = 32;

        // ============================================
        // КЛАСС ДЛЯ РАБОТЫ С ХРАНИЛИЩЕМ
        // ============================================
        class LocalDB {
            constructor() {
                this.loadData();
            }
            
            loadData() {
                const data = localStorage.getItem('robotLogger');
                if (data) {
                    this.data = JSON.parse(data);
                } else {
                    this.data = {
                        users: {},
                        currentUser: null
                    };
                    this.save();
                }
            }
            
            save() {
                localStorage.setItem('robotLogger', JSON.stringify(this.data));
            }
            
            getUsers() {
                return Object.keys(this.data.users);
            }
            
            getCurrentUser() {
                return this.data.currentUser;
            }
            
            setCurrentUser(login) {
                this.data.currentUser = login;
                this.save();
            }
            
            createUser(login) {
                if (!this.data.users[login]) {
                    this.data.users[login] = {
                        state: "welcome",
                        logs: [],
                        logs_archive: [],
                        robot_info: ["", ""],
                        robot_history: [[], []],
                        commands: JSON.parse(JSON.stringify(DEFAULT_COMMANDS)),
                        temporary: null,
                        editing_command: null,
                        coordinates: {
                            current: DEFAULT_COORDS_LINK,
                            last_input: DEFAULT_COORDS_TEXT,
                            coord_counter: 1,
                            address_counter: 1
                        },
                        settings: {
                            theme: "dark"
                        },
                        created: new Date().toISOString()
                    };
                    this.save();
                }
                return this.data.users[login];
            }
            
            getUser(login) {
                return this.data.users[login] || this.createUser(login);
            }
            
            setUser(login, key, value) {
                if (this.data.users[login]) {
                    this.data.users[login][key] = value;
                    this.save();
                }
            }
            
            saveCommands(login, commands) {
                if (this.data.users[login]) {
                    this.data.users[login].commands = commands;
                    this.save();
                }
            }
            
            // Парсинг координат из текста
            parseCoordinates(input) {
                const cleanInput = input.trim();
                
                // 1. Формат ?pt=37.6173,55.755826 или ?pt=37.6173%2C55.755826
                const ptMatch = cleanInput.match(/[?&]pt=([^&]+)/);
                if (ptMatch) {
                    let ptValue = decodeURIComponent(ptMatch[1]);
                    const coordsMatch = ptValue.match(/(-?\d+\.?\d*)\s*[, ]\s*(-?\d+\.?\d*)/);
                    if (coordsMatch) {
                        const lon = coordsMatch[1].trim();
                        const lat = coordsMatch[2].trim();
                        return { 
                            type: 'coords', 
                            lon: lon, 
                            lat: lat,
                            fullLink: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16`
                        };
                    }
                }
                
                // 2. Формат ?ll=37.6173,55.755896
                const llMatch = cleanInput.match(/[?&]ll=([^&]+)/);
                if (llMatch) {
                    let llValue = decodeURIComponent(llMatch[1]);
                    const coordsMatch = llValue.match(/(-?\d+\.?\d*)\s*[, ]\s*(-?\d+\.?\d*)/);
                    if (coordsMatch) {
                        const lon = coordsMatch[1].trim();
                        const lat = coordsMatch[2].trim();
                        return { 
                            type: 'coords', 
                            lon: lon, 
                            lat: lat,
                            fullLink: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16`
                        };
                    }
                }
                
                // 3. Простые числовые координаты (широта, долгота)
                const coordsMatch = cleanInput.match(/(-?\d+\.?\d*)\s*[, ]\s*(-?\d+\.?\d*)/);
                if (coordsMatch) {
                    const lat = coordsMatch[1].trim().replace(/[^\d.-]/g, '');
                    const lon = coordsMatch[2].trim().replace(/[^\d.-]/g, '');
                    return { 
                        type: 'coords', 
                        lon: lon, 
                        lat: lat,
                        fullLink: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16`
                    };
                }
                
                // 4. Ссылка Яндекс.Карт без извлекаемых координат
                if (cleanInput.includes('yandex.ru/maps')) {
                    return { 
                        type: 'coords', 
                        lon: null, 
                        lat: null,
                        fullLink: cleanInput.startsWith('http') ? cleanInput : `https://${cleanInput}`
                    };
                }
                
                // 5. Текст (адрес)
                return { type: 'address', text: cleanInput };
            }
            
            updateCoordinates(login, input) {
                const user = this.getUser(login);
                const coords = user.coordinates;
                
                const parsed = this.parseCoordinates(input);
                const now = new Date();
                const timeStr = now.toLocaleTimeString();
                let logEntry;
                
                if (parsed.type === 'coords') {
                    const linkToSave = parsed.fullLink || DEFAULT_COORDS_LINK;
                    coords.current = linkToSave;
                    
                    // Формируем текст для архива: Координаты_Х     ссылка     широта,долгота
                    const coordNumber = coords.coord_counter;
                    const coordText = parsed.lon && parsed.lat ? `${parsed.lat}, ${parsed.lon}` : '';
                    
                    logEntry = {
                        text: `${timeStr} Координаты_${coordNumber}     ${linkToSave}     ${coordText}`,
                        link: linkToSave,
                        shortText: `Координаты_${coordNumber}`, // для отображения в текущей сессии
                        type: 'coords'
                    };
                    coords.coord_counter += 1;
                    coords.last_input = coordText;
                } else {
                    logEntry = {
                        text: `${timeStr} Адрес_${coords.address_counter}: ${input}`,
                        link: null,
                        type: 'address'
                    };
                    coords.address_counter += 1;
                }
                
                const logs = [...user.logs, logEntry];
                this.data.users[login].logs = logs;
                this.save();
                
                return logEntry;
            }
            
            resetCounters(login) {
                if (this.data.users[login]) {
                    this.data.users[login].coordinates.coord_counter = 1;
                    this.data.users[login].coordinates.address_counter = 1;
                    this.save();
                }
            }
            
            toggleTheme(login) {
                if (this.data.users[login]) {

        async function handleFullBackupNoUser() {
            addMessage('💾 Создание полного бэкапа...', 'system');
            
            const users = db.getUsers();
            const zip = new JSZip();
            const metadata = {
                exportDate: new Date().toISOString(),
                version: "1.0",
                users: users,
                totalLogs: 0
            };
            
            // Создаем папку для каждого пользователя
            for (const login of users) {
                const userData = db.getUser(login);
                const userFolder = zip.folder(`users/${login}`);
                
                // Сохраняем JSON-данные
                userFolder.file('commands.json', JSON.stringify(userData.commands, null, 2));
                userFolder.file('settings.json', JSON.stringify({
                    theme: userData.settings.theme,
                    coordinates: userData.coordinates,
                    robot_history: userData.robot_history
                }, null, 2));
                
                // Сохраняем архив логов в JSON
                userFolder.file('archive.json', JSON.stringify(userData.logs_archive, null, 2));
                
                // Экспортируем каждый проезд в отдельный TXT
                const logsFolder = userFolder.folder('logs_export');
                userData.logs_archive.forEach((entry, idx) => {
                    const footer = entry[entry.length - 1];
                    const logs = entry.slice(0, -1);
                    const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3]);
                    const filename = `proezd_${idx+1}_${footer[0]}_${footer[1]}_${footer[2].replace(/:/g,'-')}.txt`;
                    logsFolder.file(filename, content);
                    metadata.totalLogs++;
                });
            }
            
            // Добавляем метаданные и инструкцию
            zip.file('metadata.json', JSON.stringify(metadata, null, 2));
            zip.file('README.txt', generateReadme());
            
            // Генерируем и скачиваем архив
            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.zip`;
            a.click();
            URL.revokeObjectURL(url);
            
            addMessage(`✅ Полный бэкап создан: ${metadata.totalLogs} проездов`, 'system');
        }

        function formatLogEntry(entry) {
            if (typeof entry === 'string') return entry;
            if (entry && typeof entry === 'object') {
                if (entry.type === 'coords') {
                    return entry.text; // В архиве показываем полную строку с ссылкой и координатами
                }
                if (entry.type === 'address') {
                    return entry.text;
                }
                return JSON.stringify(entry);
            }
            return String(entry);
        }

        function formatLogsForExport(logs, robot, route, startTime, endTime) {
            const header = `Лог проезда\nРобот: ${robot}\nМаршрут: ${route}\nНачало: ${startTime}\nОкончание: ${endTime}\n\n`;
            const body = logs.map(formatLogEntry).join('\n');
            return header + body;
        }

        function importCommands() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json';
            input.onchange = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!Array.isArray(imported) || !imported.every(cmd => cmd.name && cmd.log_text)) {
                            throw new Error('Неверный формат файла');
                        }
                        db.saveCommands(currentUser, imported);
                        addMessage('✅ Команды успешно импортированы', 'system');
                        handleUserCommands();
                    } catch (err) {
                        addMessage(`❌ Ошибка импорта: ${err.message}`, 'system');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

            });
            
            showKeyboard(buttons);
            showInput('Номер робота...');
            db.setUser(currentUser, 'state', 'awaiting_robot');
        }

        function handleSelectRobot(robotNum) {
            const user = db.getUser(currentUser);
            const robotNumStr = String(robotNum);
            
            const robotInfo = [...user.robot_info];
            robotInfo[0] = robotNumStr;
            
            const robotHistory = [...user.robot_history];
            if (!robotHistory[0].includes(robotNumStr)) {
                robotHistory[0].push(robotNumStr);
                if (robotHistory[0].length > 3) robotHistory[0].shift();
            }
            
            db.setUser(currentUser, 'robot_info', robotInfo);
            db.setUser(currentUser, 'robot_history', robotHistory);
            
            handleRouteSelection();
        }

        function handleRouteSelection() {
            const user = db.getUser(currentUser);
            const routeHistory = user.robot_history[1];
            
            addMessage('📝 Введите **название маршрута** (можно буквы и цифры):', 'system');
            
            const buttons = [[{ text: '❌ Отменить', callback: () => handleMainMenu() }]];
            
            routeHistory.slice(-3).forEach(route => {
                if (route) {
                    buttons.push([{
                        text: `⚡️ ${route}`,
                        callback: () => handleSelectRoute(route)
                    }]);
                }
            });
            
            showKeyboard(buttons);
            showInput('Название маршрута...');
            db.setUser(currentUser, 'state', 'awaiting_route');
        }

        function handleSelectRoute(routeNum) {
            const user = db.getUser(currentUser);
            const routeNumStr = String(routeNum);
            
            const robotInfo = [...user.robot_info];
            robotInfo[1] = routeNumStr;
            
            const robotHistory = [...user.robot_history];
            if (!robotHistory[1].includes(routeNumStr)) {
                robotHistory[1].push(routeNumStr);
                if (robotHistory[1].length > 3) robotHistory[1].shift();
            }
            
            db.setUser(currentUser, 'robot_info', robotInfo);
            db.setUser(currentUser, 'robot_history', robotHistory);
            
            db.resetCounters(currentUser);
            
            showLoggingScreen();
        }

        function showLoggingScreen() {
            const user = db.getUser(currentUser);
            const robotInfo = user.robot_info;
            const logs = user.logs || [];
            const commands = user.commands;
            
            let logsHTML = '';
            logs.forEach(log => {
                if (typeof log === 'string') {
                    logsHTML += `<br>${log}`;
                } else if (log.type === 'coords' && log.link) {
                    logsHTML += `<br><span class="coords-link" data-link="${log.link}">${log.shortText || log.text.split('     ')[0]}</span>`;
                } else if (log.type === 'address') {
                    logsHTML += `<br><span class="address-text">${log.text}</span>`;
                } else {
                    logsHTML += `<br>${JSON.stringify(log)}`;
                }
            });
            
            let header = `🤖 **${robotInfo[0] || '?'}** • 🗺 **${robotInfo[1] || '?'}**\n`;
            
            addMessage(header + (logsHTML || '<br>(пока нет записей)'), 'system', true);
            
            const buttons = [
                [
                    { text: '❌ Закончить', class: 'danger', callback: () => handleStopRecording() },
                    { text: '❌ Удалить последнюю', class: 'danger', callback: () => handleDeleteLastLog() },
                    { text: '🗺️ Координаты', class: 'primary', callback: () => handlePasteCoordinates() },
                    { text: '👁️ Открыть', callback: () => handleViewCoordinates() }
                ]
            ];
            
            for (let i = 0; i < commands.length; i += 2) {
                const row = [];
                row.push({
                    text: `${i+1}. ${commands[i].name}`,
                    callback: () => handleAction(i)
                });
                
                if (i + 1 < commands.length) {
                    row.push({
                        text: `${i+2}. ${commands[i+1].name}`,
                        callback: () => handleAction(i+1)
                    });
                }
                
                buttons.push(row);
            }
            
            showKeyboard(buttons);
            showInput('Или введите свой текст...');
            db.setUser(currentUser, 'state', 'logging');
        }

        function handleAction(index) {
            const user = db.getUser(currentUser);
            const command = user.commands[index];
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            
            const logEntry = `${timeStr} ${command.log_text}`;
            
            const logs = [...user.logs, logEntry];
            
            db.setUser(currentUser, 'logs', logs);
            updateStats();
            showLoggingScreen();
        }

        function handleDeleteLastLog() {
            const user = db.getUser(currentUser);
            const logs = [...user.logs];
            
            if (logs.length > 0) {
                logs.pop();
                db.setUser(currentUser, 'logs', logs);
                addMessage('✅ Последняя запись удалена', 'system');
            }
            
            showLoggingScreen();
        }

        // ============================================
        // ФУНКЦИИ ДЛЯ РАБОТЫ С КООРДИНАТАМИ
        // ============================================
        function handlePasteCoordinates() {
            addMessage('🗺️ **Вставьте координаты** (любой формат):\n\n• Ссылка Яндекс.Карт\n• Числовые координаты (широта, долгота)\n• Текстовый адрес', 'system');
            
            showKeyboard([
                [
                    { text: '👁️ Посмотреть текущие координаты', callback: () => handleViewCoordinates() },
                    { text: '❌ Отмена', callback: () => showLoggingScreen() }
                ]
            ]);
            
            showInput('Вставьте координаты или адрес...');
            db.setUser(currentUser, 'state', 'awaiting_coordinates');
        }

        function handleSaveCoordinates(input) {
            const logEntry = db.updateCoordinates(currentUser, input);
            
            if (logEntry.type === 'coords') {
                addMessage(`✅ Координаты сохранены`, 'system');
            } else {
                addMessage(`📝 Адрес сохранен`, 'system');
            }
            
            updateStats();
            showLoggingScreen();
        }

        function handleViewCoordinates() {
            const user = db.getUser(currentUser);
            const coords = user.coordinates;
            
            window.open(coords.current, '_blank');
            addMessage(`👁️ Открыты координаты: ${coords.last_input}`, 'system');
        }

        function handleStopRecording() {
            const user = db.getUser(currentUser);
            const robotInfo = user.robot_info;
            const logs = user.logs;
            
            const now = new Date();
            const currentTime = now.toLocaleTimeString();
            
            // Определяем время начала (первая запись или текущее время, если логов нет)
            let startTime = currentTime;
            if (logs.length > 0) {
                const firstLog = logs[0];
                if (typeof firstLog === 'string') {
                    startTime = firstLog.split(' ')[0];
                } else if (firstLog && firstLog.text) {
                    startTime = firstLog.text.split(' ')[0];
                }
            }
            
            const logFooter = [robotInfo[0], robotInfo[1], startTime, currentTime];
            
            const archive = [...user.logs_archive];
            const archiveEntry = [...logs, logFooter];
            archive.unshift(archiveEntry);
            
            if (archive.length > MAX_ARCHIVE_SIZE) {
                archive.length = MAX_ARCHIVE_SIZE;
            }
            
            db.setUser(currentUser, 'logs_archive', archive);
            db.setUser(currentUser, 'logs', []);
            
            addMessage('✅ Запись завершена и сохранена в архиве!', 'system');
            updateStats();
            handleMainMenu();
        }

        function handleShowLastLog() {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            
            if (archive.length === 0) {
                addMessage('❌ Нет сохраненных проездов', 'error');
                showKeyboard([
                    [{ text: '◀️ Назад', callback: () => handleMainMenu() }]
                ]);
            } else {
                const lastLog = archive[0];
                const logsText = lastLog.slice(0, -1).map(formatLogEntry).join('\n');
                const footer = lastLog[lastLog.length - 1];
                
                const header = `🤖 **${footer[0]}** • 🗺 **${footer[1]}**\n📅 ${footer[2]} — ${footer[3]}\n\n`;
                addMessage(header + logsText, 'system');
                
                showKeyboard([
                    [{ text: '📥 Экспорт в TXT', callback: () => exportLastLog() }],
                    [{ text: '◀️ Назад', callback: () => handleMainMenu() }]
                ]);
            }
        }

        function exportLastLog() {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            if (archive.length === 0) return;
            
            const lastLog = archive[0];
            const logs = lastLog.slice(0, -1);
            const footer = lastLog[lastLog.length - 1];
            
            const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3]);
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `log_${footer[0]}_${footer[1]}_${footer[2].replace(/:/g,'-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            addMessage('📥 Последний лог экспортирован', 'system');
        }

        function handleShowArchive() {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            
            if (archive.length === 0) {
                addMessage('❌ Архив пуст', 'error');
                showKeyboard([
                    [{ text: '◀️ Назад', callback: () => handleMainMenu() }]
                ]);
                return;
            }
            
            let text = '📑 **Архив проездов**\n\n';
            const buttons = [];
            
            archive.forEach((entry, i) => {
                const footer = entry[entry.length - 1];
                const displayText = `🤖 ${footer[0]} • 🗺 ${footer[1]} • ${footer[2]} — ${footer[3]}`;
                text += `${i+1}. ${displayText}\n`;
                buttons.push([{
                    text: `📄 ${displayText}`,
                    callback: () => handleViewArchiveItem(i)
                }]);
            });
            
            addMessage(text, 'system');
            buttons.push([{ text: '📦 Экспорт архива (ZIP)', callback: () => showArchiveExportSelection() }]);
            buttons.push([{ text: '◀️ Назад', callback: () => handleMainMenu() }]);
            showKeyboard(buttons);
        }

        function showArchiveExportSelection() {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            
            if (archive.length === 0) return;
            
            addMessage('📦 **Выберите проезды для экспорта** (по умолчанию все отмечены):', 'system');
            
            const container = document.createElement('div');
            container.className = 'button-grid';
            
            const checkboxes = [];
            
            archive.forEach((entry, i) => {
                const footer = entry[entry.length - 1];
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `export_${i}`;
                checkbox.checked = true;
                
                const label = document.createElement('label');
                label.htmlFor = `export_${i}`;
                label.textContent = `${i+1}. 🤖 ${footer[0]} • 🗺 ${footer[1]} • ${footer[2]} — ${footer[3]}`;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                container.appendChild(div);
                
                checkboxes.push(checkbox);
            });
            
            const buttonRow = document.createElement('div');
            buttonRow.className = 'button-row';
            
            const exportBtn = document.createElement('button');
            exportBtn.textContent = '✅ Экспорт выбранных';
            exportBtn.className = 'primary';
            exportBtn.onclick = () => exportSelectedArchive(checkboxes);
            
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = '❌ Отмена';
            cancelBtn.onclick = () => handleShowArchive();
            
            buttonRow.appendChild(exportBtn);
            buttonRow.appendChild(cancelBtn);
            container.appendChild(buttonRow);
            
            document.getElementById('keyboardArea').innerHTML = '';
            document.getElementById('keyboardArea').appendChild(container);
        }

        async function exportSelectedArchive(checkboxes) {
            const user = db.getUser(currentUser);
            const archive = user.logs_archive;
            
            const selectedIndices = [];
            checkboxes.forEach((cb, idx) => {
                if (cb.checked) selectedIndices.push(idx);
            });
            
            if (selectedIndices.length === 0) {
                addMessage('❌ Ничего не выбрано', 'system');
                handleShowArchive();
                return;
            }
            
            const zip = new JSZip();
            
            selectedIndices.forEach(idx => {
                const entry = archive[idx];
                const logs = entry.slice(0, -1);
                const footer = entry[entry.length - 1];
                
                const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3]);
                const filename = `log_${footer[0]}_${footer[1]}_${footer[2].replace(/:/g,'-')}.txt`;
                zip.file(filename, content);
            });
            
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `archive_${currentUser}_${new Date().toISOString().slice(0,10)}.zip`;
            a.click();
            URL.revokeObjectURL(url);
            
            addMessage(`📦 Экспортировано проездов: ${selectedIndices.length}`, 'system');
            handleShowArchive();
        }

        function handleViewArchiveItem(index) {
            const user = db.getUser(currentUser);
            const entry = user.logs_archive[index];
            
            const logsText = entry.slice(0, -1).map(formatLogEntry).join('\n');
            const footer = entry[entry.length - 1];
            
            const header = `🤖 **${footer[0]}** • 🗺 **${footer[1]}**\n📅 ${footer[2]} — ${footer[3]}\n\n`;
            addMessage('📄 **Архивный лог**\n\n' + header + logsText, 'system');
            
            showKeyboard([
                [{ text: '📥 Экспорт в TXT', callback: () => exportArchiveItem(index) }],
                [{ text: '◀️ Назад в архив', callback: () => handleShowArchive() }]
            ]);
        }

        function exportArchiveItem(index) {
            const user = db.getUser(currentUser);
            const entry = user.logs_archive[index];
            const logs = entry.slice(0, -1);
            const footer = entry[entry.length - 1];
            
            const content = formatLogsForExport(logs, footer[0], footer[1], footer[2], footer[3]);
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `log_${footer[0]}_${footer[1]}_${footer[2].replace(/:/g,'-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            addMessage('📥 Лог экспортирован', 'system');
        }

        // ============================================
        // ОБРАБОТКА СООБЩЕНИЙ
        // ============================================
        function sendMessage() {
            if (!currentUser) {
                addMessage('❌ Сначала выберите пользователя', 'error');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            input.value = '';
            
            addMessage(`👤 ${text}`, 'system');
            
            const user = db.getUser(currentUser);
            const state = user.state;
            
            if (state === 'awaiting_robot') {
                handleSelectRobot(text);
            } else if (state === 'awaiting_route') {
                handleSelectRoute(text);
            } else if (state === 'awaiting_coordinates') {
                handleSaveCoordinates(text);
            } else if (state === 'logging') {
                const now = new Date();
                const timeStr = now.toLocaleTimeString();
                
                const logs = [...user.logs, `${timeStr} ${text}`];
                db.setUser(currentUser, 'logs', logs);
                updateStats();
                showLoggingScreen();
            } else if (state === 'user_add_name') {
                handleUserAddName(text);
            } else if (state === 'user_add_log') {
                handleUserAddLog(text);
            } else if (state === 'user_edit_log') {
                handleUserEditLog(text);
            } else {
                handleMainMenu();
            }
            
            // Скрываем клавиатуру после отправки на мобильных устройствах
            if (window.innerWidth <= 600) {
                input.blur();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ
        // ============================================
        window.onload = function() {
            loadUsers();
            
            const savedUser = db.getCurrentUser();
            if (savedUser && db.getUsers().includes(savedUser)) {
                document.getElementById('userSelect').value = savedUser;
                switchUser();
            } else {
                // Показываем глобальные действия на начальном экране
                document.getElementById('globalActions').classList.remove('hidden');
                document.getElementById('userSelector').classList.remove('hidden');
            }
            
            if (db.getUsers().length === 0) {
                db.createUser('Оператор_1');
                db.createUser('Оператор_2');
                loadUsers();
            }
            
            // Настраиваем обработку мобильной клавиатуры
            setupMobileKeyboardHandling();
        };
    </script>
</body>
</html>
