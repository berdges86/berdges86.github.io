<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сравнение документов PRO (Стрелки + Темы)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        /* ======= CSS ПЕРЕМЕННЫЕ И ТЕМЫ ======= */
        :root {
            --bg: #0b0e14;
            --panel: #141a24;
            --panel2: #1a2230;
            --border: #2a3344;
            --text: #e8edf5;
            --text-muted: #8899b0;
            --line-same: #2ea043;
            --line-changed: #dbb331;
            --line-deleted: #f85149;
            --line-added: #58a6ff;
            --shadow: rgba(0,0,0,0.5);
        }

        body.theme-light {
            --bg: #f0f4fa;
            --panel: #ffffff;
            --panel2: #f8fafc;
            --border: #d0d8e0;
            --text: #1a2230;
            --text-muted: #5a6a7a;
            --line-same: #2ea043;
            --line-changed: #dbb331;
            --line-deleted: #f85149;
            --line-added: #58a6ff;
            --shadow: rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        #root { max-width: 1600px; margin: 0 auto; }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px;
            background: var(--panel);
            border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap; gap: 12px;
            transition: background 0.3s, border 0.3s;
        }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #6cb4ee, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .header-actions button {
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .header-actions button:hover { background: var(--border); }
        
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        @media (max-width: 768px) { .upload-grid { grid-template-columns: 1fr; } }
        
        .upload-box {
            background: var(--panel);
            border: 2px dashed var(--border);
            border-radius: 16px; padding: 32px 20px; text-align: center; transition: all 0.3s; cursor: pointer;
            position: relative; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        }
        .upload-box:hover { border-color: #4a6a8a; }
        .upload-box.dragover { border-color: #6cb4ee; background: var(--panel2); }
        .upload-box.has-file { border-color: var(--line-same); border-style: solid; background: var(--panel); }
        .upload-box .icon { font-size: 48px; }
        .upload-box .label { font-size: 15px; color: var(--text-muted); font-weight: 500; }
        .upload-box .filename { font-size: 14px; color: #6cb4ee; font-weight: 600; word-break: break-all; }
        .upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-box .file-info { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .upload-box .status { font-size: 13px; margin-top: 6px; color: #58a6ff; }
        .upload-box .status.error { color: #f85149; }
        
        .viewer-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0;
            background: var(--panel);
            border-radius: 16px; border: 1px solid var(--border);
            overflow: hidden; min-height: 600px; margin-bottom: 16px;
            position: relative;
            transition: background 0.3s, border 0.3s;
        }
        @media (max-width: 1024px) { .viewer-container { grid-template-columns: 1fr; } }
        
        .viewer-panel { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; transition: background 0.3s; }
        .viewer-panel .panel-header {
            padding: 12px 16px; background: var(--panel2);
            border-bottom: 1px solid var(--border);
            font-size: 14px; font-weight: 600; color: var(--text-muted);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; position: sticky; top: 0; z-index: 10;
            transition: background 0.3s, border 0.3s;
        }
        .viewer-panel .panel-header .badge { background: var(--panel); padding: 4px 12px; border-radius: 20px; font-size: 11px; color: var(--text-muted); font-weight: 400; }
        
        .viewer-content {
            flex: 1; overflow-y: auto; padding: 20px; background: var(--bg); 
            white-space: pre-wrap; word-break: break-word; line-height: 1.8; 
            transition: background 0.3s;
            position: relative;
        }
        .viewer-content .placeholder { color: var(--text-muted); text-align: center; padding: 80px 20px; font-style: italic; }
        
        #diffSvgLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1000; overflow: visible;
        }
        #diffSvgLayer path {
            fill: none; stroke-width: 3; opacity: 0.9; 
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }
        #diffSvgLayer path:hover { stroke-width: 5; opacity: 1; }
        .arrow-same { stroke: var(--line-same); stroke-dasharray: 5,5; }
        .arrow-changed { stroke: var(--line-changed); stroke-width: 3.5; }
        .arrow-deleted { stroke: var(--line-deleted); stroke-width: 3.5; }
        .arrow-added { stroke: var(--line-added); stroke-width: 3.5; }

        .text-line {
            padding: 4px 12px; border-radius: 4px; margin: 2px 0; transition: all 0.2s;
            position: relative;
        }
        .text-line.same { background: rgba(46, 160, 67, 0.08); border-left: 3px solid var(--line-same); }
        .text-line.changed { background: rgba(219, 171, 49, 0.12); border-left: 3px solid var(--line-changed); }
        .text-line.deleted { background: rgba(248, 81, 73, 0.08); border-left: 3px solid var(--line-deleted); text-decoration: line-through; opacity: 0.7; }
        .text-line.added { background: rgba(88, 166, 255, 0.08); border-left: 3px solid var(--line-added); }
        
        .image-block {
            margin: 12px 0; padding: 16px; border-radius: 8px; background: var(--panel);
            border: 2px solid var(--border); text-align: center; position: relative; transition: background 0.3s, border 0.3s;
        }
        .image-block.same { border-color: var(--line-same); background: rgba(46, 160, 67, 0.05); }
        .image-block.changed { border-color: var(--line-changed); background: rgba(219, 171, 49, 0.08); }
        .image-block.deleted { border-color: var(--line-deleted); background: rgba(248, 81, 73, 0.08); }
        .image-block.added { border-color: var(--line-added); background: rgba(88, 166, 255, 0.08); }
        .image-block img { max-width: 100%; max-height: 400px; border-radius: 6px; display: block; margin: 0 auto; }
        .image-block .image-label { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
        .image-block .image-badge {
            position: absolute; top: 8px; right: 8px; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
            background: rgba(0,0,0,0.6); color: white; backdrop-filter: blur(4px);
        }
        .image-badge.same { background: var(--line-same); color: white; }
        .image-badge.changed { background: var(--line-changed); color: white; }
        .image-badge.deleted { background: var(--line-deleted); color: white; }
        .image-badge.added { background: var(--line-added); color: white; }

        .stats-panel {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px;
            background: var(--panel); border-radius: 16px; padding: 16px 20px; border: 1px solid var(--border); margin-bottom: 16px;
            transition: background 0.3s, border 0.3s;
        }
        .stats-panel .stat-item { display: flex; flex-direction: column; }
        .stats-panel .stat-item .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .stats-panel .stat-item .stat-value { font-size: 22px; font-weight: 700; }
        .green { color: var(--line-same); } .yellow { color: var(--line-changed); } .red { color: var(--line-deleted); } .blue { color: var(--line-added); }

        .legend {
            display: flex; flex-wrap: wrap; gap: 16px 24px; padding: 12px 20px;
            background: var(--panel); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px;
            transition: background 0.3s, border 0.3s;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
        .legend-item .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); }
        .legend-item .swatch.same { background: var(--line-same); }
        .legend-item .swatch.changed { background: var(--line-changed); }
        .legend-item .swatch.deleted { background: var(--line-deleted); }
        .legend-item .swatch.added { background: var(--line-added); }

        .diff-nav { display: flex; gap: 12px; align-items: center; padding: 10px 0; flex-wrap: wrap; margin-bottom: 16px; }
        .diff-nav button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; font-weight: 500; }
        .diff-nav button:hover:not(:disabled) { background: var(--panel2); border-color: var(--line-added); }
        .diff-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
        .diff-nav .counter { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .diff-nav .info { font-size: 13px; color: var(--text-muted); margin-left: 12px; }
        
        .progress { height: 8px; background: var(--border); border-radius: 8px; overflow: hidden; margin-top: 15px; }
        .progressBar { height: 100%; width: 0; background: #58a6ff; transition: 0.3s; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Анимация для стрелок */
        @keyframes arrowPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; stroke-width: 4; }
        }
        #diffSvgLayer path {
            animation: arrowPulse 2s ease-in-out infinite;
        }
        #diffSvgLayer path:hover {
            animation: none;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="header">
            <h1>📄 Сравнение документов PRO</h1>
            <div class="header-actions">
                <button id="themeToggle">☀️ Светлая</button>
                <button onclick="window.location.reload()">🔄 Сбросить</button>
            </div>
        </div>
        
        <div class="upload-grid">
            <div class="upload-box" id="upload1"><div class="icon">📂</div><div class="label">Документ №1</div><div class="filename" id="file1name">—</div><div class="file-info" id="file1info"></div><div class="status" id="status1">Ожидание</div><input type="file" id="fileInput1" accept=".pdf,.docx,.doc" /></div>
            <div class="upload-box" id="upload2"><div class="icon">📂</div><div class="label">Документ №2</div><div class="filename" id="file2name">—</div><div class="file-info" id="file2info"></div><div class="status" id="status2">Ожидание</div><input type="file" id="fileInput2" accept=".pdf,.docx,.doc" /></div>
        </div>
        
        <div class="progress"><div class="progressBar" id="progressBar"></div></div>
        
        <div class="legend">
            <span class="legend-item"><span class="swatch same"></span> Совпадает</span>
            <span class="legend-item"><span class="swatch changed"></span> Изменено</span>
            <span class="legend-item"><span class="swatch deleted"></span> Удалено</span>
            <span class="legend-item"><span class="swatch added"></span> Добавлено</span>
            <span class="legend-item" style="margin-left:auto;border-left:1px solid var(--border);padding-left:16px;">🖼️ Изображения</span>
        </div>

        <div class="viewer-container" id="viewerContainer">
            <div class="viewer-panel"><div class="panel-header"><span>📄 Документ 1</span><span class="badge" id="badge1">—</span></div><div class="viewer-content" id="content1"><div class="placeholder">📂 Загрузите документ №1</div></div></div>
            <div class="viewer-panel"><div class="panel-header"><span>📄 Документ 2</span><span class="badge" id="badge2">—</span></div><div class="viewer-content" id="content2"><div class="placeholder">📂 Загрузите документ №2</div></div></div>
            <svg id="diffSvgLayer"></svg>
        </div>
        
        <div class="diff-nav">
            <button id="prevDiff" disabled>◀ Предыдущее</button>
            <span class="counter" id="diffCounter">Отличий: 0</span>
            <button id="nextDiff" disabled>Следующее ▶</button>
            <span class="info" id="diffInfo">—</span>
        </div>
        
        <div class="stats-panel">
            <div class="stat-item"><span class="stat-label">🟢 Совпадает</span><span class="stat-value green" id="statSame">0</span></div>
            <div class="stat-item"><span class="stat-label">🔴 Удалено</span><span class="stat-value red" id="statDeleted">0</span></div>
            <div class="stat-item"><span class="stat-label">🔵 Добавлено</span><span class="stat-value blue" id="statAdded">0</span></div>
            <div class="stat-item"><span class="stat-label">🟡 Изменено</span><span class="stat-value yellow" id="statChanged">0</span></div>
        </div>
    </div>
    
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const $ = id => document.getElementById(id);
        const escapeHtml = str => String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const ext = name => name.split('.').pop().toLowerCase();

        const ui = {
            f1: $('fileInput1'), f2: $('fileInput2'), n1: $('file1name'), n2: $('file2name'),
            s1: $('status1'), s2: $('status2'), b1: $('badge1'), b2: $('badge2'),
            c1: $('content1'), c2: $('content2'), bar: $('progressBar'),
            svg: $('diffSvgLayer'), container: $('viewerContainer'),
            sS: $('statSame'), sD: $('statDeleted'), sA: $('statAdded'), sC: $('statChanged'),
            navC: $('diffCounter'), navI: $('diffInfo'), btnP: $('prevDiff'), btnN: $('nextDiff')
        };
        const state = { text1: '', text2: '', images1:[], images2:[], coords1:[], coords2:[], pages1:0, pages2:0, diffs:[], diffIndex:0 };

        let isLight = false;
        $('themeToggle').addEventListener('click', () => {
            isLight = !isLight;
            document.body.classList.toggle('theme-light', isLight);
            $('themeToggle').textContent = isLight ? '🌙 Тёмная' : '☀️ Светлая';
            if(state.diffs.length) drawArrows();
        });

        async function extractImagesAndCoords(pdfDoc) {
            const images = [], coords = [];
            for (let p = 1; p <= pdfDoc.numPages; p++) {
                const page = await pdfDoc.getPage(p);
                const vp = page.getViewport({ scale: 1.0 });
                const canvas = document.createElement('canvas');
                canvas.width = vp.width; canvas.height = vp.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                const data = canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
                let hasImg = false;
                for(let j=0; j<data.length; j+=400) {
                    const r=data[j], g=data[j+1], b=data[j+2];
                    if(Math.abs(r-g)+Math.abs(g-b)+Math.abs(b-r)>30 && r>30 && r<230){ hasImg=true; break; }
                }
                if(hasImg && canvas.width>50 && canvas.height>50) {
                    const thumb = document.createElement('canvas');
                    const max=300; let w=canvas.width,h=canvas.height;
                    if(w>h){ if(w>max){ h=h*max/w; w=max; } } else { if(h>max){ w=w*max/h; h=max; } }
                    thumb.width=w; thumb.height=h;
                    thumb.getContext('2d').drawImage(canvas,0,0,w,h);
                    images.push({ id:`img_${p}`, page:p, dataUrl:thumb.toDataURL('image/png'), label:`Стр. ${p}` });
                }
                const tc = await page.getTextContent();
                for(const item of tc.items) if(item.str.trim()) coords.push({ text:item.str, x:item.transform[4], y:item.transform[5], page:p });
            }
            return { images, coords };
        }
        async function parsePDF(file) {
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const tc = await page.getTextContent();
                fullText += `--- Страница ${i} ---\n`;
                fullText += tc.items.map(i=>i.str).join(' ') + '\n\n';
            }
            const res = await extractImagesAndCoords(pdf);
            return { text: fullText.trim(), images: res.images, coords: res.coords, pages: pdf.numPages };
        }
        async function parseDOCX(file) {
            const result = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
            return { text: result.value, images:[], coords:[], pages: Math.max(1, Math.ceil(result.value.length / 3000)) };
        }

        function paragraphScore(a,b) {
            if(!a||!b)return 0; if(a===b)return 1;
            const wa=a.split(/\s+/), wb=b.split(/\s+/);
            if(!wa.length||!wb.length)return 0;
            const common=wa.filter(w=>wb.includes(w)).length;
            return common/Math.max(wa.length,wb.length);
        }
        
        function buildSpatialDiff(coords1, coords2) {
            if(!coords1.length || !coords2.length) return fallbackLCS(state.text1, state.text2);
            function group(coords) {
                const map = {};
                for(const c of coords) { const key=`${c.page}-${Math.round(c.y)}`; if(!map[key]) map[key]=[]; map[key].push(c.text); }
                return Object.entries(map).map(([k, v]) => { const [p,y]=k.split('-').map(Number); return {page:p, y, text:v.join(' ')}; })
                       .sort((a,b)=>a.page-b.page || a.y-b.y);
            }
            const g1 = group(coords1), g2 = group(coords2);
            const n=g1.length, m=g2.length;
            const dp=Array(n+1).fill(null).map(()=>Array(m+1).fill(0));
            for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) {
                const match = g1[i-1].text.trim() === g2[j-1].text.trim() ? 1 : 0;
                dp[i][j] = Math.max(dp[i-1][j-1]+match, dp[i-1][j], dp[i][j-1]);
            }
            const res=[]; let i=n,j=m;
            while(i>0||j>0) {
                if(i>0 && j>0 && paragraphScore(g1[i-1].text, g2[j-1].text) >= 0.65) {
                    if(g1[i-1].text.trim() === g2[j-1].text.trim()) res.unshift({type:'same', left:g1[i-1].text, right:g2[j-1].text, page:g1[i-1].page});
                    else res.unshift({type:'changed', left:g1[i-1].text, right:g2[j-1].text, page:g1[i-1].page});
                    i--; j--;
                } else if(j>0 && (i===0 || dp[i][j-1] >= dp[i-1][j])) { res.unshift({type:'added', left:'', right:g2[j-1].text, page:g2[j-1].page}); j--; }
                else { res.unshift({type:'deleted', left:g1[i-1].text, right:'', page:g1[i-1].page}); i--; }
            }
            return res;
        }
        
        function fallbackLCS(t1, t2) {
            const l1=t1.split('\n'), l2=t2.split('\n');
            const dp=Array(l1.length+1).fill(null).map(()=>Array(l2.length+1).fill(0));
            for(let i=1;i<=l1.length;i++) for(let j=1;j<=l2.length;j++) {
                if(l1[i-1].trim()===l2[j-1].trim()) dp[i][j]=dp[i-1][j-1]+1;
                else dp[i][j]=Math.max(dp[i-1][j], dp[i][j-1]);
            }
            const res=[]; let i=l1.length,j=l2.length;
            while(i>0||j>0) {
                if(i>0&&j>0&&l1[i-1].trim()===l2[j-1].trim()) { res.unshift({type:'same', left:l1[i-1], right:l2[j-1]}); i--; j--; }
                else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])) { res.unshift({type:'added', left:'', right:l2[j-1]}); j--; }
                else { res.unshift({type:'deleted', left:l1[i-1], right:''}); i--; }
            }
            return res;
        }

        function renderDiff(diffs) {
            let h1='', h2='';
            let countS=0,countD=0,countA=0,countC=0;
            const img1 = new Map(state.images1.map(i=>[i.page,i]));
            const img2 = new Map(state.images2.map(i=>[i.page,i]));
            let lastPage=0;

            diffs.forEach((d, idx) => {
                const page = d.page || 0;
                const left = d.left || '', right = d.right || '';
                const type = d.type;

                if(page !== lastPage && page > 0) {
                    const sep = `--- Страница ${page} ---`;
                    h1 += `<div class="text-line same" style="opacity:0.5;">${escapeHtml(sep)}</div>`;
                    h2 += `<div class="text-line same" style="opacity:0.5;">${escapeHtml(sep)}</div>`;
                    
                    const i1 = img1.get(page), i2 = img2.get(page);
                    if(i1?.dataUrl) { 
                        const cls = i2 ? 'same' : 'deleted'; 
                        const bdg = i2 ? '✅ Совпадает' : '❌ Удалено';
                        h1 += `<div class="image-block ${cls}" data-img-idx="${idx}"><div class="image-badge ${cls}">${bdg}</div><img src="${i1.dataUrl}"/><div class="image-label">${i1.label}</div></div>`;
                        if(!i2) h2 += `<div class="image-block deleted" style="opacity:0.2;border-color:#444;"><div class="image-badge deleted">❌ Удалено</div><div style="height:100px;display:flex;align-items:center;justify-content:center;color:#444;">[Изображение отсутствует]</div></div>`;
                    }
                    if(i2?.dataUrl && !i1) { 
                        const cls = 'added'; 
                        const bdg = '🆕 Добавлено';
                        h1 += `<div class="image-block added" style="opacity:0.2;border-color:#444;"><div class="image-badge added">🆕 Добавлено</div><div style="height:100px;display:flex;align-items:center;justify-content:center;color:#444;">[Изображение добавлено]</div></div>`;
                        h2 += `<div class="image-block ${cls}" data-img-idx="${idx}"><div class="image-badge ${cls}">${bdg}</div><img src="${i2.dataUrl}"/><div class="image-label">${i2.label}</div></div>`;
                    }
                    lastPage = page;
                }

                const cls = type;
                if(type === 'same') countS += left.length;
                else if(type === 'deleted') countD += left.length;
                else if(type === 'added') countA += right.length;
                else if(type === 'changed') countC += left.length + right.length;

                h1 += `<div class="text-line ${cls}" data-diff-idx="${idx}">${escapeHtml(left)}</div>`;
                h2 += `<div class="text-line ${cls}" data-diff-idx="${idx}">${escapeHtml(right)}</div>`;
            });

            ui.c1.innerHTML = h1 || '<div class="placeholder">Пустой документ</div>';
            ui.c2.innerHTML = h2 || '<div class="placeholder">Пустой документ</div>';

            ui.sS.textContent = countS; ui.sD.textContent = countD; ui.sA.textContent = countA; ui.sC.textContent = countC;
            const total = countS+countD+countA+countC;
            ui.navC.textContent = `Отличий: ${countD+countA+countC}`;
            ui.navI.textContent = total > 0 ? `🔍 ${(countS/total*100).toFixed(1)}%` : '✅ Идентичны';

            state.diffs = diffs;
            state.diffIndex = 0;
            
            setTimeout(() => drawArrows(), 100);
        }

        // ============================================================
        //  ГЛАВНАЯ ФУНКЦИЯ ОТРИСОВКИ СТРЕЛОК - УЛУЧШЕННАЯ ВЕРСИЯ
        // ============================================================
        function drawArrows() {
            const svg = ui.svg;
            const container = ui.container;
            svg.innerHTML = '';

            if (!state.diffs.length) {
                console.log('Нет различий для отображения');
                return;
            }

            const panel1 = ui.c1;
            const panel2 = ui.c2;
            
            // Получаем все строки с data-diff-idx
            const els1 = panel1.querySelectorAll('[data-diff-idx]');
            const els2 = panel2.querySelectorAll('[data-diff-idx]');
            const map1 = new Map(), map2 = new Map();
            els1.forEach(el => map1.set(parseInt(el.dataset.diffIdx), el));
            els2.forEach(el => map2.set(parseInt(el.dataset.diffIdx), el));

            console.log(`Найдено элементов: Док1=${els1.length}, Док2=${els2.length}`);

            // Функция получения центра элемента относительно контейнера
            function getElementCenter(el, panel) {
                if (!el) return null;
                const elRect = el.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                return {
                    x: (elRect.left + elRect.right) / 2 - containerRect.left,
                    y: (elRect.top + elRect.bottom) / 2 - containerRect.top,
                    left: elRect.left - containerRect.left,
                    right: elRect.right - containerRect.left,
                    top: elRect.top - containerRect.top,
                    bottom: elRect.bottom - containerRect.left
                };
            }

            // Проверка видимости элемента
            function isElementVisible(el, panel) {
                if (!el) return false;
                const rect = el.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const top = rect.top - panelRect.top;
                const bottom = rect.bottom - panelRect.top;
                const height = panel.clientHeight;
                // Элемент виден, если его центр в пределах панели
                const center = (top + bottom) / 2;
                return center > -50 && center < height + 50;
            }

            const lines = [];
            const containerRect = container.getBoundingClientRect();

            // Проходим по всем diff элементам и рисуем стрелки для изменений
            for (let i = 0; i < state.diffs.length; i++) {
                const d = state.diffs[i];
                if (d.type === 'same') continue; // Пропускаем совпадающие строки

                const el1 = map1.get(i);
                const el2 = map2.get(i);
                
                // Проверяем видимость
                const visible1 = el1 ? isElementVisible(el1, panel1) : false;
                const visible2 = el2 ? isElementVisible(el2, panel2) : false;

                // Для changed нужны оба видимых, для deleted/added хотя бы один
                if (d.type === 'changed' && (!visible1 || !visible2)) continue;
                if (d.type === 'deleted' && !visible1) continue;
                if (d.type === 'added' && !visible2) continue;

                let x1, y1, x2, y2;
                const arrowClass = `arrow-${d.type}`;

                if (d.type === 'deleted') {
                    // Стрелка от удаленного текста к правому краю
                    if (!el1) continue;
                    const center = getElementCenter(el1, panel1);
                    if (!center) continue;
                    const panel1Rect = panel1.getBoundingClientRect();
                    x1 = center.right + 5;
                    y1 = center.y;
                    x2 = panel1Rect.right - containerRect.left - 20;
                    y2 = center.y;
                    
                    // Добавляем текст "УДАЛЕНО"
                    lines.push(`<text x="${(x1+x2)/2}" y="${y1-10}" fill="var(--line-deleted)" font-size="10" font-weight="bold" text-anchor="middle">✕</text>`);
                    
                } else if (d.type === 'added') {
                    // Стрелка от левого края к добавленному тексту
                    if (!el2) continue;
                    const center = getElementCenter(el2, panel2);
                    if (!center) continue;
                    const panel2Rect = panel2.getBoundingClientRect();
                    x1 = panel2Rect.left - containerRect.left + 20;
                    y1 = center.y;
                    x2 = center.left - 5;
                    y2 = center.y;
                    
                    // Добавляем текст "ДОБАВЛЕНО"
                    lines.push(`<text x="${(x1+x2)/2}" y="${y1-10}" fill="var(--line-added)" font-size="10" font-weight="bold" text-anchor="middle">➕</text>`);
                    
                } else if (d.type === 'changed') {
                    // Стрелка между измененными строками
                    if (!el1 || !el2) continue;
                    const center1 = getElementCenter(el1, panel1);
                    const center2 = getElementCenter(el2, panel2);
                    if (!center1 || !center2) continue;
                    
                    // От правого края левого элемента к левому краю правого
                    x1 = center1.right + 2;
                    y1 = center1.y;
                    x2 = center2.left - 2;
                    y2 = center2.y;
                    
                    // Добавляем текст "ИЗМЕНЕНО"
                    const midX = (x1 + x2) / 2;
                    const midY = (y1 + y2) / 2 - 15;
                    lines.push(`<text x="${midX}" y="${midY}" fill="var(--line-changed)" font-size="10" font-weight="bold" text-anchor="middle">⚡</text>`);
                }

                // Добавляем линию
                if (x1 !== undefined && y1 !== undefined && x2 !== undefined && y2 !== undefined) {
                    const dx = x2 - x1, dy = y2 - y1;
                    if (Math.sqrt(dx*dx + dy*dy) > 10) { // Минимальная длина
                        lines.push(`<path d="M ${x1} ${y1} L ${x2} ${y2}" class="${arrowClass}" marker-end="url(#arrowHead-${d.type})"/>`);
                    }
                }
            }

            console.log(`Создано линий: ${lines.length}`);

            // Маркеры для стрелок
            const markers = `
                <defs>
                    <marker id="arrowHead-changed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
                        <path d="M 0 0 L 12 6 L 0 12 z" fill="var(--line-changed)"/>
                    </marker>
                    <marker id="arrowHead-deleted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
                        <path d="M 0 0 L 12 6 L 0 12 z" fill="var(--line-deleted)"/>
                    </marker>
                    <marker id="arrowHead-added" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
                        <path d="M 0 0 L 12 6 L 0 12 z" fill="var(--line-added)"/>
                    </marker>
                </defs>
            `;

            svg.innerHTML = markers + lines.join('');
            
            // Если линий нет, показываем сообщение
            if (lines.length === 0) {
                svg.innerHTML = markers + `<text x="50%" y="50%" fill="var(--text-muted)" font-size="14" text-anchor="middle">Нет видимых изменений</text>`;
            }
        }

        // ============================================================
        //  ЗАГРУЗКА И ОБРАБОТЧИКИ
        // ============================================================
        async function loadFile(file, side) {
            if(!file) return;
            const box = side===1 ? $('upload1') : $('upload2');
            const statusEl = side===1 ? ui.s1 : ui.s2;
            const nameEl = side===1 ? ui.n1 : ui.n2;
            const badgeEl = side===1 ? ui.b1 : ui.b2;
            nameEl.textContent = file.name; box.classList.add('has-file'); 
            statusEl.textContent = '⏳ Обработка...';
            statusEl.className = 'status';
            
            try {
                let data;
                if(ext(file.name)==='pdf') data = await parsePDF(file);
                else data = await parseDOCX(file);
                
                if(side===1) { state.text1=data.text; state.images1=data.images; state.coords1=data.coords||[]; state.pages1=data.pages; }
                else { state.text2=data.text; state.images2=data.images; state.coords2=data.coords||[]; state.pages2=data.pages; }
                
                badgeEl.textContent = `${data.pages} стр.`;
                statusEl.textContent = `✅ ${data.pages} стр.`;
                
                if(state.text1 && state.text2) {
                    const diffs = buildSpatialDiff(state.coords1, state.coords2);
                    renderDiff(diffs);
                }
            } catch(err){ 
                statusEl.textContent = '❌ '+err.message;
                statusEl.className = 'status error';
                console.error(err);
            }
        }

        ui.f1.addEventListener('change', e=>{ if(e.target.files.length) loadFile(e.target.files[0], 1); });
        ui.f2.addEventListener('change', e=>{ if(e.target.files.length) loadFile(e.target.files[0], 2); });
        
        ['upload1','upload2'].forEach((id, idx)=>{
            const box = $(id);
            box.addEventListener('dragover', e=>{e.preventDefault(); box.classList.add('dragover');});
            box.addEventListener('dragleave', ()=>box.classList.remove('dragover'));
            box.addEventListener('drop', async e=>{ 
                e.preventDefault(); 
                box.classList.remove('dragover'); 
                const f=e.dataTransfer.files[0]; 
                if(f) loadFile(f, idx+1); 
            });
        });
        
        // Синхронизация скролла и перерисовка стрелок
        let scrollTimeout = null;
        const handleScroll = () => {
            if (scrollTimeout) return;
            scrollTimeout = true;
            
            // Синхронизация скролла
            if (ui.c1.scrollTop !== ui.c2.scrollTop) {
                ui.c2.scrollTop = ui.c1.scrollTop;
            }
            
            // Перерисовка стрелок с задержкой
            requestAnimationFrame(() => {
                if (state.diffs.length) drawArrows();
                setTimeout(() => { scrollTimeout = false; }, 50);
            });
        };
        
        ui.c1.addEventListener('scroll', handleScroll);
        ui.c2.addEventListener('scroll', () => {
            if (ui.c2.scrollTop !== ui.c1.scrollTop) {
                ui.c1.scrollTop = ui.c2.scrollTop;
            }
            if (state.diffs.length) drawArrows();
        });

        // Перерисовка при изменении размера
        let resizeTimeout = null;
        window.addEventListener('resize', () => {
            if (resizeTimeout) return;
            resizeTimeout = true;
            setTimeout(() => {
                if (state.diffs.length) drawArrows();
                resizeTimeout = false;
            }, 300);
        });

        ui.btnP.addEventListener('click', ()=>{});
        ui.btnN.addEventListener('click', ()=>{});

        console.log('🚀 Документы PRO с улучшенными стрелками');
        console.log('📌 Стрелки показывают связи между изменениями');
    </script>
</body>
</html>
